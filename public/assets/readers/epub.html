<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>电子书阅读器</title><style>
*{box-sizing:border-box}#back{color:inherit;font-size:12px;white-space:nowrap}body{margin:0;font:14px system-ui;background:#f8f7f3;color:#202124}header{display:flex;gap:8px;align-items:center;padding:10px;border-bottom:1px solid #ddd;flex-wrap:wrap}button,input,select{font:inherit;padding:6px 9px;border:1px solid #ccc;border-radius:4px;background:white;color:#222}button{cursor:pointer}button:disabled{opacity:.4}h1{font-size:14px;margin:0;flex:1;min-width:140px}#toc{max-width:250px}#book{max-width:960px;margin:0 auto;height:calc(100vh - 125px);min-height:260px;overflow:hidden}footer{max-width:960px;margin:auto;display:flex;justify-content:space-between;gap:12px;padding:10px;font-size:12px}#status{padding:8px 12px;font-size:12px}#error{color:#9e2929;white-space:pre-wrap}body.dark{background:#1c2025;color:#eee}.dark button,.dark select{background:#292e35;color:#eee;border-color:#555}#searchResults{max-height:150px;overflow:auto;padding:0 12px}#searchResults button{display:block;text-align:left;width:100%;margin:4px 0;font-size:12px}#searchForm{display:flex;gap:6px}#searchForm input{width:145px}#book iframe{border:0}body:fullscreen #book{max-width:960px;margin:0 auto;height:calc(100vh - 125px)}
</style><script defer src="jszip-3.10.2/jszip.min.js"></script><script defer src="epubjs-0.3.93/epub.min.js"></script><script defer src="epub-reader.js"></script></head><body>
<header><a id="back" href="/#knowledgeLibrary?space=mine&tab=drive">返回网盘</a><h1 id="title">电子书阅读器</h1><select id="toc" aria-label="章节目录"><option>正在读取目录</option></select><button id="smaller" aria-label="减小字号">A−</button><button id="larger" aria-label="增大字号">A＋</button><button id="theme">夜间模式</button><button id="fullscreen">全屏</button><form id="searchForm"><input id="search" aria-label="搜索书内文字" placeholder="搜索书内文字"><button>查找</button></form></header>

</body></html>
