  backdrop-filter: var(--glass); -webkit-backdrop-filter: var(--glass);
  box-shadow: var(--shadow-pop);
  transition: opacity .3s, transform .3s;
}
.back-top:hover { transform: scale(1.08); color: var(--accent); }
.back-top.hidden { opacity: 0; pointer-events: none; transform: translateY(12px); }
.back-top svg { width: 18px; height: 18px; }

/* ---------- 登录 / 注册页 ---------- */
.auth-wrap { min-height: 100vh; display: grid; place-items: center; padding: 24px; }
.auth-card {
  position: relative;
  width: min(380px, 100%);
  background: var(--surface); border: var(--border-w) solid var(--border);
  border-radius: var(--radius-lg); box-shadow: var(--shadow-pop);
  padding: 30px 28px;
}
.auth-close {
  position: absolute; top: 14px; right: 14px; width: 28px; height: 28px; line-height: 1;
  border: none; background: transparent; color: var(--text-3); cursor: pointer;
  border-radius: 8px; font-size: 15px; transition: background .15s, color .15s;
}
.auth-close:hover { background: var(--bg-sunken); color: var(--text); }
/* 侧边栏底部·游客登录入口（与用户条同构：空白头像 + 请登录） */
.user-avatar-guest {
  background: var(--bg-sunken); color: var(--text-3); cursor: pointer; transition: color .15s, border-color .15s;
  border: var(--border-w) dashed var(--border);
}
.user-avatar-guest svg { width: 14px; height: 14px; }
.guest-name { flex: 0 1 auto; margin-left: -3px; cursor: pointer; transition: color .15s; }
.user-strip:has(.guest-name) .strip-btn { margin-left: auto; }
.user-avatar-guest:hover, .guest-name:hover { color: var(--accent); }
.user-avatar-guest:hover { border-color: var(--accent); }
.auth-brand { display: flex; align-items: center; gap: 12px; margin-bottom: 6px; }
.auth-brand h1 { font-family: var(--font-display); font-weight: var(--display-weight); font-size: 22px; }
.auth-sub { color: var(--text-3); font-size: 13px; margin-bottom: 20px; }
.auth-tabs { display: flex; gap: 8px; margin-bottom: 18px; }
.auth-tab {
  flex: 1; padding: 8px; border-radius: var(--radius-sm); font-size: 13.5px; font-weight: 650;
  border: var(--border-w) solid var(--border); background: transparent; color: var(--text-2);
  transition: all .18s;
}
.auth-tab.active { background: var(--accent); color: var(--accent-contrast); border-color: var(--accent); }
.auth-error { color: oklch(58% 0.2 25); font-size: 13px; font-weight: 600; margin-top: 4px; }

/* ---------- AI 对话 ---------- */
.chat-workbench {
  display: grid; grid-template-columns: minmax(0, 1fr) minmax(260px, 320px);
  gap: 12px; align-items: stretch;
}
.chat-shell {
  display: flex; flex-direction: column;
  height: calc(100vh - 50px - 14px - 38px - 24px);
  min-height: 420px;
  border: var(--border-w) solid var(--border); border-radius: var(--radius-lg);
  background: var(--surface); box-shadow: var(--shadow-card);
  backdrop-filter: var(--glass); -webkit-backdrop-filter: var(--glass);
  overflow: hidden;
}
.chat-msgs { flex: 1; overflow-y: auto; padding: 22px 22px 10px; display: flex; flex-direction: column; gap: 14px; }
.msg-row { display: flex; }
.msg-row.user { justify-content: flex-end; }
.msg-bubble {
  max-width: 76%; padding: 10px 15px; border-radius: var(--radius);
  font-size: 14px; line-height: 1.75; white-space: pre-wrap; word-break: break-word;
}
.msg-row.user .msg-bubble { background: var(--accent); color: var(--accent-contrast); border-bottom-right-radius: 4px; }
.msg-row.assistant .msg-bubble {
  background: var(--bg-sunken); border: var(--border-w) solid var(--border);
  color: var(--text); border-bottom-left-radius: 4px;
}
.msg-bubble.thinking { color: var(--text-3); font-style: italic; }

/* ---------- AI 回复的 Markdown 排版 ---------- */
.md-body { white-space: normal; }
.md-body > :first-child { margin-top: 0; }
.md-body > :last-child { margin-bottom: 0; }
.md-body p { margin: 8px 0; }
.md-body h1, .md-body h2, .md-body h3, .md-body h4 {
  font-family: var(--font-display); font-weight: var(--display-weight);
  margin: 14px 0 6px; line-height: 1.4;
}
.md-body h1 { font-size: 17px; }
.md-body h2 { font-size: 16px; }
.md-body h3, .md-body h4 { font-size: 14.5px; }
.md-body ul, .md-body ol { margin: 8px 0; padding-left: 22px; }
.md-body li { margin: 3px 0; }
.md-body code {
  font-family: var(--font-mono); font-size: 12.5px;
  background: var(--bg-sunken); border: var(--border-w) solid var(--border);
  border-radius: 5px; padding: 1px 6px;
}
.md-body pre {
  background: var(--bg-sunken); border: var(--border-w) solid var(--border);
  border-radius: var(--radius-sm); padding: 12px 14px; margin: 10px 0;
  overflow-x: auto;
}
.md-body pre code { background: none; border: none; padding: 0; font-size: 12.5px; line-height: 1.7; }
.md-body blockquote {
  margin: 10px 0; padding: 2px 0 2px 12px;
  border-left: 3px solid var(--accent); color: var(--text-2);
}
.md-body table { border-collapse: collapse; margin: 10px 0; font-size: 13px; }
.md-body th, .md-body td { border: var(--border-w) solid var(--border); padding: 5px 10px; }
.md-body th { background: var(--bg-sunken); font-weight: 650; }
.md-body a { color: var(--accent); }
.md-body hr { border: none; height: var(--border-w); background: var(--border); margin: 12px 0; }
.md-body img { max-width: 100%; border-radius: var(--radius-sm); }
.chat-empty { flex: 1; display: grid; place-items: center; text-align: center; color: var(--text-3); padding: 24px; }
.chat-empty .empty-icon {
  width: 56px; height: 56px; margin: 0 auto 12px; border-radius: var(--radius);
  display: grid; place-items: center; background: var(--accent-soft); color: var(--accent);
}
.chat-empty .empty-icon svg { width: 26px; height: 26px; }
.chat-input-row {
  display: flex; gap: 10px; align-items: flex-end;
  padding: 14px 16px; border-top: var(--border-w) solid var(--border);
}
.chat-input {
  flex: 1; resize: none; max-height: 140px;
  padding: 10px 14px; border-radius: var(--radius);
  border: var(--border-w) solid var(--border); background: var(--bg-sunken); color: var(--text);
  font-size: 14px; line-height: 1.6; outline: none;
  transition: border-color .18s, box-shadow .18s;
}
.chat-input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.chat-model-tag {
  font-size: 11.5px; color: var(--text-3); padding: 2px 10px;
  border: var(--border-w) solid var(--border); border-radius: 99px;
}
.chat-capture-panel {
  border: var(--border-w) solid var(--border); border-radius: var(--radius-lg);
  background: var(--surface); box-shadow: var(--shadow-card);
  padding: 15px; min-height: 420px;
  display: flex; flex-direction: column; gap: 14px;
}
.capture-panel-head { display: flex; gap: 10px; align-items: flex-start; }
.capture-panel-head > svg {
  width: 28px; height: 28px; padding: 6px; border-radius: 9px;
  background: var(--accent-soft); color: var(--accent); flex-shrink: 0;
}
.capture-panel-head h3 { font-family: var(--font-display); font-size: 15px; line-height: 1.3; }
.capture-panel-head p { color: var(--text-3); font-size: 12px; line-height: 1.55; margin-top: 3px; }
.capture-template-list { display: grid; gap: 8px; }
.capture-template {
  display: flex; align-items: center; justify-content: space-between; gap: 10px;
  padding: 10px 11px; border-radius: var(--radius-sm);
  border: var(--border-w) solid var(--border); background: var(--bg-sunken);
  color: var(--text-2); font-size: 12.5px; font-weight: 650; text-align: left;
  transition: border-color .18s, color .18s, background .18s;
}
.capture-template:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }
.capture-template svg { width: 14px; height: 14px; flex-shrink: 0; }
.capture-rules {
  margin-top: auto; display: grid; gap: 8px;
  padding-top: 12px; border-top: var(--border-w) solid var(--border);
}
.capture-rules div { display: grid; gap: 2px; }
.capture-rules strong { font-size: 12px; color: var(--text-2); }
.capture-rules span { font-size: 11.5px; color: var(--text-3); }

/* ---------- AI 设置预设 ---------- */
.preset-row { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
.preset-chip {
  padding: 5px 13px; border-radius: 99px; font-size: 12.5px; font-weight: 600;
  border: var(--border-w) solid var(--border); background: transparent; color: var(--text-2);
  transition: all .18s;
}
.preset-chip:hover { color: var(--accent); border-color: var(--accent); background: var(--accent-soft); }

/* ---------- 响应式 ---------- */
@media (max-width: 1000px) {
  .header-greet { display: none; }
  .tools-board { grid-template-columns: 1fr; }
  .chat-workbench { grid-template-columns: 1fr; }
  .chat-capture-panel { min-height: 0; }
  .inbox-workspace { grid-template-columns: minmax(240px, 310px) minmax(0, 1fr); }
}
@media (max-width: 860px) {
  .sidebar { position: fixed; z-index: 80; top: 50px; left: 0; display: flex; box-shadow: var(--shadow-pop); }
  .main { padding: 20px 16px 48px; }
  .brand-title { font-size: 15px; }
  .brand-sub { display: none; }
  .search-wrap { width: 100%; }
  .tool-card-wide { min-height: 0; }
  .tool-split, .pdf-preset-row, .pdf-file-meta, .asset-stat-grid, .prompt-pipeline, .tool-workflow { grid-template-columns: 1fr; }
  .tools-quick-grid { grid-template-columns: 1fr; }
  .asset-hero { align-items: flex-start; flex-direction: column; }
  .asset-library-head, .asset-compact-head { align-items: flex-start; flex-direction: column; }
  .asset-tabs { width: 100%; overflow-x: auto; }
  .asset-tabs button { flex: 1; justify-content: center; white-space: nowrap; }
  .asset-head-actions { width: 100%; }
  .inbox-workspace { height: auto; min-height: 0; grid-template-columns: 1fr; }
  .inbox-list { max-height: 340px; border-right: none; border-bottom: var(--border-w) solid var(--border); }
  .inbox-detail { min-height: 500px; }
  .inbox-detail-head { flex-direction: column; }
  .capture-bar { flex-direction: column; }
  .capture-bar .btn { min-height: 38px; }
  .feed-save { opacity: 1; transform: none; }
  .inbox-drawer { min-height: 0; }
  .inbox-drawer .inbox-detail-head { flex-direction: row; }
  .inbox-x-toolbar { align-items: flex-start; flex-direction: column; }
}

/* ============================================================
   动效合集（参考 transitions.dev）
   1) 数字 pop-in：每位数字 blur+translateY 进入，stagger
   2) Skeleton → 内容 cross-fade：信息流加载占位
   3) Tab 滑动 pill：active 指示器跨 tab 平滑滑动
   4) Accordion grid-rows：grid-rows 0fr→1fr 折叠
   5) 文字 blur swap：换句/状态切换的 blur 交叉淡入
   ============================================================ */

/* 1) 数字 pop-in */
.anim-num {
  display: inline-flex; align-items: baseline;
  font-variant-numeric: tabular-nums;
}
.anim-num-digit {
  display: inline-block;
  animation: numPop .36s cubic-bezier(.2, 1.1, .35, 1) backwards;
}
@keyframes numPop {
  0%   { opacity: 0; filter: blur(4px); transform: scale(.55); }
  60%  { opacity: 1; filter: blur(0);   transform: scale(1.18); }
  100% { opacity: 1; filter: blur(0);   transform: scale(1); }
}

/* 2) Skeleton 占位 + 交叉淡入 */
.feed-skeleton-list {
  display: flex; flex-direction: column; gap: 7px;
  animation: skeletonFade .35s ease;
}
.feed-skeleton-card {
  display: flex; gap: 11px; padding: 11px 13px;
  border-radius: var(--radius-sm); border: var(--border-w) solid var(--border);
  background: var(--surface); box-shadow: var(--shadow-card);
}
.feed-skeleton-rank {
  width: 20px; height: 18px; border-radius: 4px; flex-shrink: 0;
  background: var(--bg-sunken);
}
.feed-skeleton-body { flex: 1; display: flex; flex-direction: column; gap: 8px; }
.sk-line {
  height: 12px; border-radius: 6px;
  background: linear-gradient(90deg,
    var(--bg-sunken) 0%,
    color-mix(in oklch, var(--bg-sunken) 70%, var(--surface)) 50%,
    var(--bg-sunken) 100%);
  background-size: 200% 100%;
  animation: skShimmer 1.4s ease-in-out infinite;
}
.sk-line.lg { height: 15px; width: 78%; }
.sk-line.sm { height: 10px; width: 42%; }
@keyframes skShimmer {
  0%   { background-position: 200% 0; }
  100% { background-position: -200% 0; }
}
@keyframes skeletonFade {
  from { opacity: 0; }
  to   { opacity: 1; }
}
.feed-skeleton-list.leaving {
  animation: skeletonLeave .28s ease forwards;
}
@keyframes skeletonLeave {
  from { opacity: 1; filter: blur(0); }
  to   { opacity: 0; filter: blur(6px); }
}
.feed-content-enter {
  animation: feedContentEnter .32s ease both;
}
@keyframes feedContentEnter {
  from { opacity: 0; filter: blur(6px); transform: translateY(6px); }
  to   { opacity: 1; filter: blur(0);   transform: none; }
}

/* 3) Tab 滑动 pill */
.tabs-pill-wrap {
  position: relative;
  display: flex; gap: 8px; flex-wrap: wrap;
  isolation: isolate;
}
.tabs-pill-indicator {
  position: absolute; top: 0; left: 0;
  border-radius: var(--radius-sm);
  background: var(--accent);
  pointer-events: none;
  z-index: -1;
  opacity: 0;
  transition:
    transform .42s cubic-bezier(.4, 1.2, .3, 1),
    width .42s cubic-bezier(.4, 1.2, .3, 1),
    height .42s cubic-bezier(.4, 1.2, .3, 1),
    opacity .2s ease,
    border-radius .25s ease;
}
.tabs-pill-indicator.ready { opacity: 1; }
.tabs-pill-indicator.pill-chip {
  border-radius: 99px;
  background: var(--text-2);
}
/* 当 pill 接管 active 配色，原 active 状态退去背景，只保留前景色变化 */
.tabs-pill-wrap .feed-source.active {
  background: transparent;
  border-color: transparent;
  color: var(--accent-contrast);
}
.tabs-pill-wrap .feed-source.active .src-cat {
  background: oklch(100% 0 0 / .25); color: var(--accent-contrast);
}
.tabs-pill-wrap .feed-source {
  position: relative; z-index: 1;
  transition: color .22s ease;
}
.tabs-pill-wrap.pill-chip-mode .filter-chip.active {
  background: transparent;
  border-color: transparent;
  color: var(--bg);
}
.tabs-pill-wrap.pill-chip-mode .filter-chip {
  position: relative; z-index: 1;
  transition: color .22s ease;
}

/* 4) Accordion（grid-rows 0fr → 1fr）+ chevron 旋转 */
.collapsible {
  border: var(--border-w) solid var(--border);
  border-radius: var(--radius-sm);
  background: var(--surface);
  overflow: hidden;
}
.collapsible-head {
  display: flex; align-items: center; gap: 8px; width: 100%;
  padding: 8px 12px;
  border: none; background: transparent; color: var(--text);
  font-size: 12.5px; font-weight: 650; text-align: left; cursor: pointer;
}
.collapsible-head .chev {
  margin-left: auto; width: 14px; height: 14px;
  color: var(--text-3);
  transition: transform .28s cubic-bezier(.4, 1.2, .3, 1);
}
.collapsible.open .collapsible-head .chev { transform: rotate(90deg); color: var(--accent); }
.collapsible-grid {
  display: grid;
  grid-template-rows: 0fr;
  transition: grid-template-rows .32s cubic-bezier(.4, 1, .3, 1);
}
.collapsible.open .collapsible-grid { grid-template-rows: 1fr; }
.collapsible-inner {
  overflow: hidden;
  min-height: 0;
}
.collapsible-body {
  padding: 4px 12px 10px;
  display: flex; gap: 6px; flex-wrap: wrap;
}

/* 5) 文字 blur swap */
.blur-text {
  display: inline-block;
  transition:
    opacity .28s ease,
    filter .28s ease,
    transform .28s ease;
}
.blur-text.is-leaving {
  opacity: 0;
  filter: blur(8px);
  transform: translateY(-3px);
}
.blur-text.is-entering {
  opacity: 0;
  filter: blur(8px);
  transform: translateY(4px);
}

/* 创作台与作品库 */
.media-settings-tabs, .media-filter-row { display: flex; align-items: center; gap: 7px; flex-wrap: wrap; }
.media-settings-tabs { margin: 12px 0 18px; padding-bottom: 10px; border-bottom: 1px solid var(--border); }
.media-settings-tabs button, .media-filter-row button {
  padding: 7px 12px; border: 1px solid var(--border); border-radius: var(--radius-sm);
  color: var(--text-2); background: var(--surface); font-size: 12px;
}
.media-settings-tabs button.active, .media-filter-row button.active {
  color: var(--accent); border-color: var(--accent); background: var(--accent-soft);
}
.media-inline-check { display: inline-flex; align-items: center; gap: 7px; color: var(--text-2); font-size: 12px; cursor: pointer; }
.media-page-head, .media-library-toolbar, .media-reference-head, .media-job-head {
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
}
.media-page-head { margin-bottom: 18px; }
.media-page-head h1 { font-size: 21px; line-height: 1.3; }
.media-page-head p { color: var(--text-3); font-size: 12px; margin-top: 3px; }
.media-studio-layout { display: grid; grid-template-columns: minmax(0, 1.7fr) minmax(270px, .7fr); gap: 20px; align-items: start; }
.media-compose, .media-job-list { min-width: 0; }
.media-compose { display: grid; gap: 15px; }
.media-source-box { display: flex; align-items: center; flex-wrap: wrap; gap: 7px 12px; padding: 12px; background: var(--bg-sunken); border: 1px solid var(--border); border-radius: var(--radius-sm); }
.media-source-box small { color: var(--text-3); }
.media-source-box strong { font-size: 13px; }
.media-source-box a { margin-left: auto; font-size: 12px; color: var(--accent); }
.media-source-gallery > strong, .media-reference-head strong { font-size: 12px; color: var(--text-2); }
.media-source-gallery > div { display: flex; gap: 9px; overflow-x: auto; padding: 8px 0; }
.media-source-gallery > div > div { flex: 0 0 112px; display: grid; gap: 6px; }
.media-source-gallery img { width: 112px; height: 112px; object-fit: contain; background: var(--bg-sunken); border: 1px solid var(--border); border-radius: var(--radius-sm); }
.media-source-gallery .btn { font-size: 11px; padding: 5px; }
.media-form-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.media-form-grid label, .media-field, .media-edit-fields label { display: grid; gap: 6px; min-width: 0; color: var(--text-2); font-size: 12px; font-weight: 650; }
.media-field textarea { resize: vertical; min-height: 150px; line-height: 1.5; }
.media-reference-head span { font-weight: 400; color: var(--text-3); }
.media-reference-picker { display: flex; align-items: stretch; gap: 8px; overflow-x: auto; min-height: 90px; padding: 3px 0 8px; }
.media-reference-picker > p { color: var(--text-3); font-size: 12px; align-self: center; }
.media-reference-picker > button { flex: 0 0 90px; max-width: 90px; padding: 3px; display: grid; gap: 3px; border: 1px solid var(--border); background: var(--surface); border-radius: var(--radius-sm); }
.media-reference-picker > button.selected { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.media-reference-picker img, .media-reference-picker > button > span { width: 82px; height: 64px; object-fit: cover; border-radius: 5px; background: var(--bg-sunken); display: grid; place-items: center; font-size: 11px; }
.media-reference-picker small { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; font-size: 10px; color: var(--text-2); }
.media-submit { display: grid; justify-items: start; gap: 10px; padding: 14px 0; border-top: 1px solid var(--border); }
.media-submit p, .media-note { color: var(--text-3); font-size: 12px; line-height: 1.5; }
.media-job-list { position: sticky; top: 14px; max-height: calc(100vh - 130px); overflow-y: auto; border-left: 1px solid var(--border); padding-left: 18px; }
.media-job-head h2 { font-size: 14px; }
.media-job { padding: 11px 0; border-bottom: 1px solid var(--border); }
.media-job > div:first-child { display: flex; align-items: start; gap: 8px; justify-content: space-between; }
.media-job strong { font-size: 12px; line-height: 1.4; overflow-wrap: anywhere; }
.media-job span { flex-shrink: 0; color: var(--accent); font-size: 11px; }
.media-job small { display: block; margin: 5px 0; color: var(--text-3); font-size: 10px; }
.media-job p { color: var(--text-2); font-size: 11px; line-height: 1.4; }
.media-job-actions { display: flex; gap: 6px; margin-top: 7px; }
.media-job-actions .btn { padding: 5px 8px; font-size: 11px; }
.media-library-toolbar { margin: 14px 0; flex-wrap: wrap; }
.media-library-toolbar > div:last-of-type { display: flex; gap: 8px; }
.media-filter-row .select { min-width: 105px; font-size: 12px; padding: 6px; }
.media-gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(205px, 1fr)); gap: 15px; }
.media-card { display: grid; align-content: start; gap: 6px; min-width: 0; padding: 0 0 10px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-sm); overflow: hidden; text-align: left; }
.media-card:hover { border-color: var(--accent); }
.media-card-preview { position: relative; aspect-ratio: 4 / 3; background: var(--bg-sunken); }
.media-card-preview img, .media-card-preview video { width: 100%; height: 100%; object-fit: contain; }
.media-card-preview > span:first-child { display: grid; place-items: center; height: 100%; color: var(--text-3); }
.media-play-marker { position: absolute; inset: auto auto 8px 8px; padding: 5px 9px; border-radius: 6px; background: #0009; color: #fff; font-size: 11px; }
.media-card > strong, .media-card > small { padding: 0 10px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.media-card > strong { font-size: 12.5px; }
.media-card > small { font-size: 10.5px; color: var(--text-3); }
.media-asset-drawer { width: min(710px, 100vw); }
.media-detail-preview { display: grid; place-items: center; min-height: 250px; max-height: 65vh; overflow: auto; background: var(--bg-sunken); border-radius: var(--radius-sm); }
.media-detail-preview img, .media-detail-preview video { display: block; max-width: 100%; max-height: 65vh; object-fit: contain; }
.media-detail-actions { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0; }
.media-detail-meta { padding: 8px 0; border-bottom: 1px solid var(--border); }
.media-detail-meta p, .media-detail-section p { white-space: pre-wrap; overflow-wrap: anywhere; font-size: 12px; line-height: 1.6; }
