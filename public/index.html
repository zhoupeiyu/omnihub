<!DOCTYPE html>
<html lang="zh" data-skin="minimal" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="referrer" content="no-referrer">
<link rel="icon" href="/assets/omnihub-logo.svg" type="image/svg+xml">
<link rel="mask-icon" href="/assets/omnihub-logo.svg" color="#123F43">
<title>万象台 OmniHub</title>
<style>
/* ============================================================
   万象台 OmniHub v2 — 沿用 v1 的 4 皮肤 × 2 主题设计令牌
   功能与交互参考 resource-nav：顶栏搜索 / 分类分区 / favicon /
   计数徽章 / 悬停反馈 / 回到顶部
   ============================================================ */

/* ---------- 皮肤 1：极简清爽 minimal ---------- */
:root, [data-skin="minimal"] {
  --font-display: -apple-system, "SF Pro Display", "PingFang SC", "Noto Sans SC", sans-serif;
  --font-body: -apple-system, "SF Pro Text", "PingFang SC", "Noto Sans SC", sans-serif;
  --font-mono: "SF Mono", ui-monospace, Menlo, Consolas, monospace;
  --display-weight: 650;
  --radius-sm: 8px; --radius: 12px; --radius-lg: 16px;
  --border-w: 1px;
  --bg: oklch(97.8% 0.003 250);
  --bg-sunken: oklch(96.5% 0.004 250);
  --surface: oklch(100% 0 0);
  --raised: oklch(100% 0 0);
  --text: oklch(20% 0.01 250);
  --text-2: oklch(45% 0.015 250);
  --text-3: oklch(54% 0.012 250);
  --border: oklch(90% 0.006 250);
  --accent: oklch(55% 0.21 258);
  --accent-soft: oklch(95% 0.03 258);
  --accent-contrast: #fff;
  --shadow-card: 0 1px 2px oklch(0% 0 0 / .04), 0 4px 16px oklch(0% 0 0 / .05);
  --shadow-pop: 0 4px 12px oklch(0% 0 0 / .08), 0 16px 48px oklch(0% 0 0 / .12);
  --sidebar-bg: oklch(99% 0.002 250);
  --glass: none;
}
[data-skin="minimal"][data-theme="dark"] {
  --bg: oklch(19% 0.008 255);
  --bg-sunken: oklch(15% 0.008 255);
  --surface: oklch(23% 0.01 255);
  --raised: oklch(26% 0.012 255);
  --text: oklch(94% 0.005 250);
  --text-2: oklch(72% 0.01 250);
  --text-3: oklch(68% 0.01 250);
  --border: oklch(30% 0.01 255);
  --accent: oklch(68% 0.18 258);
  --accent-soft: oklch(30% 0.06 258);
  --accent-contrast: oklch(15% 0.02 258);
  --shadow-card: 0 1px 2px oklch(0% 0 0 / .3), 0 4px 16px oklch(0% 0 0 / .25);
  --shadow-pop: 0 4px 12px oklch(0% 0 0 / .4), 0 16px 48px oklch(0% 0 0 / .5);
  --sidebar-bg: oklch(20.5% 0.008 255);
}

/* ---------- 皮肤 2：深色科技 tech ---------- */
[data-skin="tech"] {
  --font-display: "SF Pro Display", -apple-system, "PingFang SC", sans-serif;
  --font-body: -apple-system, "SF Pro Text", "PingFang SC", sans-serif;
  --font-mono: "SF Mono", ui-monospace, Menlo, monospace;
  --display-weight: 600;
  --radius-sm: 6px; --radius: 10px; --radius-lg: 14px;
  --border-w: 1px;
  --bg: oklch(97.5% 0.005 270);
  --bg-sunken: oklch(95% 0.008 270);
  --surface: oklch(99.5% 0.002 270);
  --raised: oklch(100% 0 0);
  --text: oklch(22% 0.03 275);
  --text-2: oklch(46% 0.03 275);
  --text-3: oklch(54% 0.02 275);
  --border: oklch(90% 0.009 270);
  --accent: oklch(56% 0.23 285);
  --accent-soft: oklch(93% 0.04 285);
  --accent-contrast: #fff;
  --shadow-card: 0 1px 3px oklch(30% 0.1 285 / .08), 0 8px 24px oklch(30% 0.1 285 / .08);
  --shadow-pop: 0 8px 32px oklch(30% 0.12 285 / .2);
  --sidebar-bg: oklch(99% 0.003 270);
  --glass: blur(20px) saturate(1.4);
}
[data-skin="tech"][data-theme="dark"] {
  --bg: oklch(19% 0.016 275);
  --bg-sunken: oklch(16.5% 0.014 275);
  --surface: oklch(23% 0.018 275);
  --raised: oklch(27% 0.02 275);
  --text: oklch(95% 0.01 280);
  --text-2: oklch(72% 0.03 280);
  --text-3: oklch(68% 0.025 280);
  --border: oklch(33% 0.02 278);
  --accent: oklch(72% 0.19 295);
  --accent-soft: oklch(32% 0.09 295 / .6);
  --accent-contrast: oklch(13% 0.04 295);
  --shadow-card: 0 1px 2px oklch(0% 0 0 / .4), 0 8px 32px oklch(60% 0.2 295 / .07);
  --shadow-pop: 0 8px 40px oklch(0% 0 0 / .6), 0 0 80px oklch(60% 0.2 295 / .12);
  --sidebar-bg: oklch(20.5% 0.016 275);
}

/* ---------- 皮肤 3：温暖杂志 warm ---------- */
[data-skin="warm"] {
  --font-display: "Songti SC", "Noto Serif SC", Georgia, serif;
  --font-body: -apple-system, "PingFang SC", "Noto Sans SC", sans-serif;
  --font-mono: "SF Mono", ui-monospace, Menlo, monospace;
  --display-weight: 700;
  --radius-sm: 10px; --radius: 14px; --radius-lg: 20px;
  --border-w: 1px;
  --bg: oklch(96.5% 0.015 85);
  --bg-sunken: oklch(93.5% 0.02 85);
  --surface: oklch(98.5% 0.01 90);
  --raised: oklch(99.5% 0.006 90);
  --text: oklch(28% 0.03 60);
  --text-2: oklch(48% 0.035 60);
  --text-3: oklch(62% 0.03 65);
  --border: oklch(87% 0.025 80);
  --accent: oklch(56% 0.15 45);
  --accent-soft: oklch(93% 0.04 50);
  --accent-contrast: oklch(98% 0.01 80);
  --shadow-card: 0 1px 2px oklch(40% 0.05 60 / .06), 0 6px 20px oklch(40% 0.05 60 / .08);
  --shadow-pop: 0 8px 32px oklch(35% 0.06 55 / .18);
  --sidebar-bg: oklch(94.5% 0.018 85);
  --glass: none;
}
[data-skin="warm"][data-theme="dark"] {
  --bg: oklch(21% 0.018 60);
  --bg-sunken: oklch(18% 0.015 60);
  --surface: oklch(25% 0.02 62);
  --raised: oklch(29% 0.022 62);
  --text: oklch(92% 0.02 85);
  --text-2: oklch(72% 0.03 80);
  --text-3: oklch(56% 0.03 75);
  --border: oklch(33% 0.025 65);
  --accent: oklch(72% 0.13 55);
  --accent-soft: oklch(33% 0.05 50);
  --accent-contrast: oklch(20% 0.03 55);
  --shadow-card: 0 1px 2px oklch(0% 0 0 / .3), 0 6px 20px oklch(0% 0 0 / .25);
  --shadow-pop: 0 8px 32px oklch(0% 0 0 / .45);
  --sidebar-bg: oklch(19% 0.016 60);
}

/* ---------- 皮肤 4：活泼多彩 playful ---------- */
[data-skin="playful"] {
  --font-display: -apple-system, "SF Pro Rounded", "PingFang SC", "Noto Sans SC", sans-serif;
  --font-body: -apple-system, "SF Pro Rounded", "PingFang SC", "Noto Sans SC", sans-serif;
  --font-mono: "SF Mono", ui-monospace, Menlo, monospace;
  --display-weight: 800;
  --radius-sm: 12px; --radius: 18px; --radius-lg: 24px;
  --border-w: 2px;
  --bg: oklch(96% 0.03 95);
  --bg-sunken: oklch(92.5% 0.04 95);
  --surface: oklch(99.5% 0.005 95);
  --raised: oklch(100% 0 0);
  --text: oklch(25% 0.04 290);
  --text-2: oklch(45% 0.05 290);
  --text-3: oklch(60% 0.04 290);
  --border: oklch(30% 0.04 290);
  --accent: oklch(62% 0.21 25);
  --accent-soft: oklch(92% 0.06 25);
  --accent-contrast: #fff;
  --shadow-card: 3px 3px 0 oklch(30% 0.04 290);
  --shadow-pop: 6px 6px 0 oklch(30% 0.04 290);
  --sidebar-bg: oklch(93% 0.05 160);
  --glass: none;
}
[data-skin="playful"][data-theme="dark"] {
  --bg: oklch(22% 0.04 290);
  --bg-sunken: oklch(18% 0.035 290);
  --surface: oklch(28% 0.05 290);
  --raised: oklch(33% 0.055 290);
  --text: oklch(96% 0.01 95);
  --text-2: oklch(76% 0.04 95);
  --text-3: oklch(58% 0.04 290);
  --border: oklch(60% 0.1 95);
  --accent: oklch(75% 0.17 80);
  --accent-soft: oklch(35% 0.07 80);
  --accent-contrast: oklch(22% 0.06 80);
  --shadow-card: 3px 3px 0 oklch(60% 0.1 95 / .7);
  --shadow-pop: 6px 6px 0 oklch(60% 0.1 95 / .7);
  --sidebar-bg: oklch(19% 0.045 310);
}

/* ============================================================
   基础
   ============================================================ */
* { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body {
  font-family: var(--font-body);
  background: var(--bg);
  color: var(--text);
  font-size: 14px;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
  transition: background .35s ease, color .35s ease;
}
button { font-family: inherit; cursor: pointer; }
input, select, textarea { font-family: inherit; }
section[id] { scroll-margin-top: 84px; }
::selection { background: var(--accent-soft); }
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 99px; border: 2px solid var(--bg); }
::-webkit-scrollbar-track { background: transparent; }

/* ---------- 顶栏（含全局搜索） ---------- */
.header-bar {
  position: sticky; top: 0; z-index: 40;
  background: var(--sidebar-bg);
  backdrop-filter: var(--glass); -webkit-backdrop-filter: var(--glass);
  border-bottom: var(--border-w) solid var(--border);
  transition: background .35s ease;
}
.header-inner { width: 100%; height: 50px; display: flex; align-items: center; gap: 12px; padding: 0 20px; }
.logo-mark {
  width: 34px; height: 34px; border-radius: 10px; flex-shrink: 0;
  background: color-mix(in oklch, var(--surface) 84%, var(--accent-soft));
  display: grid; place-items: center;
  box-shadow: var(--shadow-card);
  border: var(--border-w) solid color-mix(in oklch, var(--border) 72%, transparent);
  overflow: hidden;
}
.logo-mark img { width: 27px; height: 27px; display: block; }
.brand-title { font-family: var(--font-display); font-weight: var(--display-weight); font-size: 15.5px; white-space: nowrap; }
.brand-sub { display: none; }

.header-greet { display: flex; flex-direction: column; margin-left: 12px; min-width: 0; line-height: 1.45; }
.greet-main { font-size: 12.5px; font-weight: 650; color: var(--text-2); white-space: nowrap; }
.greet-sub { font-size: 10.5px; color: var(--text-3); white-space: nowrap; font-variant-numeric: tabular-nums; }

.search-wrap { position: relative; margin-left: auto; width: min(320px, 32vw); }
.search-wrap > svg { position: absolute; left: 13px; top: 50%; transform: translateY(-50%); width: 14px; height: 14px; color: var(--text-3); pointer-events: none; }
.search-input {
  width: 100%; border-radius: 99px; padding: 6px 16px 6px 35px; font-size: 13px;
  border: var(--border-w) solid var(--border); background: var(--surface); color: var(--text);
  outline: none; transition: border-color .2s, box-shadow .2s;
}
.search-input::placeholder { color: var(--text-3); }
.search-input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }

.header-actions { display: flex; gap: 8px; flex-shrink: 0; position: relative; }

/* ---------- 通用控件（与 v1 一致） ---------- */
.btn {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 6px 13px; border-radius: var(--radius-sm);
  border: var(--border-w) solid var(--border);
  background: var(--surface); color: var(--text);
  font-size: 13px; font-weight: 600;
  transition: all .18s ease;
}
.btn:hover { box-shadow: var(--shadow-card); transform: translateY(-1px); }
.btn:active { transform: translateY(0); }
.btn svg { width: 14px; height: 14px; }
.btn-primary { background: var(--accent); color: var(--accent-contrast); border-color: transparent; }
[data-skin="playful"] .btn-primary { border-color: var(--border); }
.btn-icon { padding: 6px; }
.btn-ghost { border-color: transparent; background: transparent; color: var(--text-2); }
.btn-ghost:hover { background: var(--surface); box-shadow: none; }

.input, .select {
  padding: 9px 13px; border-radius: var(--radius-sm);
  border: var(--border-w) solid var(--border);
  background: var(--surface); color: var(--text);
  font-size: 14px; width: 100%;
  outline: none; transition: border-color .18s ease, box-shadow .18s ease;
}
.input:focus, .select:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.input::placeholder { color: var(--text-3); }

/* ---------- 布局：侧边栏 + 主区 ---------- */
.layout { width: 100%; display: flex; }
.sidebar {
  position: sticky; top: 50px; height: calc(100vh - 50px); width: 224px; flex-shrink: 0;
  background: var(--sidebar-bg);
  backdrop-filter: var(--glass); -webkit-backdrop-filter: var(--glass);
  border-right: var(--border-w) solid var(--border);
  padding: 12px 10px; overflow-y: auto; overflow-x: hidden;
  transition: background .35s ease,
    width .36s cubic-bezier(.3, 1, .3, 1),
    padding .36s cubic-bezier(.3, 1, .3, 1),
    transform .36s cubic-bezier(.3, 1, .3, 1),
    opacity .26s ease;
  display: flex; flex-direction: column;
}
.sidebar.collapsed {
  width: 0; padding-left: 0; padding-right: 0;
  transform: translateX(-12px);
  opacity: 0;
  pointer-events: none;
  border-right-color: transparent;
}
/* 顶栏左侧的侧栏开合按钮（固定位置） */
.header-toggle {
  width: 32px; height: 32px; border-radius: 8px;
  display: grid; place-items: center;
  border: var(--border-w) solid transparent; background: transparent; color: var(--text-2);
  cursor: pointer; flex-shrink: 0; margin-right: 2px;
  transition: color .18s ease, background .18s ease, border-color .18s ease;
}
.header-toggle:hover { color: var(--accent); background: var(--bg-sunken); border-color: var(--border); }
.header-toggle svg {
  width: 18px; height: 18px;
  transition: transform .36s cubic-bezier(.3, 1, .3, 1);
}
.header-toggle.collapsed svg { transform: rotate(180deg); }
.sidebar-foot {
  margin-top: auto; position: relative;
  padding-top: 10px; border-top: var(--border-w) solid var(--border);
  display: flex; flex-direction: column; gap: 2px;
}
.user-strip {
  display: flex; align-items: center; gap: 9px;
  padding: 7px 8px 4px; min-width: 0;
}
.user-avatar {
  width: 27px; height: 27px; border-radius: 50%; flex-shrink: 0;
  background: var(--accent); color: var(--accent-contrast);
  display: grid; place-items: center;
  font-family: var(--font-display); font-size: 13px; font-weight: 700;
}
.user-name {
  flex: 1; min-width: 0; font-size: 13px; font-weight: 650; color: var(--text-2);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.strip-btn {
  width: 27px; height: 27px; border-radius: 8px; flex-shrink: 0;
  display: grid; place-items: center;
  border: none; background: transparent; color: var(--text-3);
  transition: background .15s ease, color .15s ease;
}
.strip-btn:hover, .strip-btn.open { background: var(--bg-sunken); color: var(--accent); }
.strip-btn svg { width: 15px; height: 15px; }
.menu-divider { height: var(--border-w); background: var(--border); margin: 6px 4px; }
.skin-row {
  display: flex; align-items: center; gap: 10px;
  padding: 8px 10px; font-size: 13px; font-weight: 600; color: var(--text-2);
}
.skin-row > svg { width: 15px; height: 15px; flex-shrink: 0; }
.menu-right { margin-left: auto; display: flex; align-items: center; gap: 7px; }
.skin-dot-btn {
  width: 17px; height: 17px; border-radius: 50%; flex-shrink: 0;
  border: var(--border-w) solid var(--border); cursor: pointer; padding: 0;
  transition: transform .15s ease, box-shadow .15s ease;
}
.skin-dot-btn:hover { transform: scale(1.18); }
.skin-dot-btn.active {
  box-shadow: 0 0 0 2px var(--raised), 0 0 0 3.5px var(--accent);
  border-color: transparent;
}
.mini-switch {
  width: 32px; height: 19px; border-radius: 99px; flex-shrink: 0;
  background: var(--bg-sunken); border: var(--border-w) solid var(--border);
  position: relative; transition: background .2s ease, border-color .2s ease;
}
.mini-switch::after {
  content: ""; position: absolute; top: 2px; left: 2px;
  width: 13px; height: 13px; border-radius: 50%;
  background: var(--text-3);
  transition: left .2s ease, background .2s ease;
}
.mini-switch.on { background: var(--accent); border-color: var(--accent); }
.mini-switch.on::after { left: 15px; background: var(--accent-contrast); }
.side-label { font-size: 10.5px; font-weight: 700; letter-spacing: .14em; color: var(--text-3); padding: 0 10px; margin: 12px 0 5px; }
.side-label:first-child { margin-top: 0; }
.nav-item {
  display: flex; align-items: center; gap: 9px; width: 100%;
  padding: 6px 10px; border-radius: var(--radius-sm);
  border: var(--border-w) solid transparent;
  background: transparent; color: var(--text-2);
  font-size: 13.5px; font-weight: 500; text-align: left;
  transition: all .18s ease; margin-bottom: 1px;
}
.nav-item:hover { background: var(--surface); color: var(--text); }
.nav-item.active {
  background: var(--surface); color: var(--accent);
  border-color: var(--border); box-shadow: var(--shadow-card);
  font-weight: 650;
}
.nav-item svg { width: 16px; height: 16px; flex-shrink: 0; }
.nav-item.nav-secondary { margin-top: 16px; }
.nav-item.nav-secondary::before {
  content: ""; position: absolute; left: 8px; right: 8px; top: -9px;
  height: var(--border-w); background: var(--border);
}
.nav-item.nav-secondary { position: relative; }
.nav-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; background: var(--text-3); transition: background .18s; }
.nav-item.active .nav-dot, .nav-item:hover .nav-dot { background: var(--accent); }
.nav-count { margin-left: auto; font-size: 11.5px; color: var(--text-3); font-variant-numeric: tabular-nums; }

.main { min-width: 0; flex: 1; padding: 14px 20px 48px; }

/* ---------- 区块标题（计数徽章 + 操作按钮） ---------- */
.section-head { display: flex; align-items: center; gap: 9px; margin: 0 0 10px; }
.section-title { font-family: var(--font-display); font-weight: var(--display-weight); font-size: 15px; display: flex; align-items: center; gap: 7px; }
.section-title svg { width: 15px; height: 15px; color: var(--accent); }
.badge-count {
  border-radius: 99px; border: var(--border-w) solid var(--border); background: var(--bg-sunken);
  color: var(--text-3); padding: 0 9px; font-size: 11.5px; font-weight: 600;
}
.section-actions { margin-left: auto; display: flex; gap: 8px; }

/* ---------- 收藏卡片（favicon + 名称 + 描述） ---------- */
.asset-hero {
  display: flex; align-items: flex-end; justify-content: space-between; gap: 16px;
  padding: 16px 18px; margin-bottom: 12px;
  border: var(--border-w) solid var(--border); border-radius: var(--radius);
  background: linear-gradient(135deg, color-mix(in oklch, var(--surface) 88%, var(--accent-soft)), var(--surface));
  box-shadow: var(--shadow-card);
}
.asset-hero .eyebrow {
  font-size: 10px; font-weight: 800; letter-spacing: .12em;
  color: var(--accent); margin-bottom: 3px;
}
.asset-hero h1 {
  font-family: var(--font-display); font-weight: var(--display-weight);
  font-size: 22px; line-height: 1.25;
}
.asset-hero p { color: var(--text-3); font-size: 13px; margin-top: 4px; max-width: 620px; }
.asset-hero-actions { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
.asset-stat-grid {
  display: grid; grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 10px; margin-bottom: 12px;
}
.asset-stat {
  text-align: left; padding: 12px 14px; border-radius: var(--radius-sm);
  border: var(--border-w) solid var(--border); background: var(--surface);
  box-shadow: var(--shadow-card);
}
.asset-stat span { display: block; font-size: 11.5px; color: var(--text-3); margin-bottom: 4px; }
.asset-stat strong {
  display: block; font-family: var(--font-mono); font-size: 22px; line-height: 1.1;
  color: var(--text); font-weight: 800;
}
.asset-lens-row {
  display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px;
  padding: 4px; border-radius: var(--radius-sm); background: var(--bg-sunken);
  border: var(--border-w) solid var(--border);
}
.asset-lens {
  display: inline-flex; align-items: center; gap: 8px; min-height: 31px;
  padding: 5px 10px; border-radius: 7px; border: var(--border-w) solid transparent;
  background: transparent; color: var(--text-2); font-size: 12.5px; font-weight: 650;
}
.asset-lens em {
  font-style: normal; font-family: var(--font-mono); color: var(--text-3); font-size: 11px;
}
.asset-lens:hover, .asset-lens.active {
  background: var(--surface); border-color: var(--border); color: var(--accent);
  box-shadow: var(--shadow-card);
}
.asset-library-head {
  display: flex; align-items: center; justify-content: space-between; gap: 16px;
  margin-bottom: 14px; padding-bottom: 12px; border-bottom: var(--border-w) solid var(--border);
}
.asset-library-head h1, .inbox-head h1 {
  font-family: var(--font-display); font-size: 20px; line-height: 1.25; font-weight: var(--display-weight);
}
.asset-library-head p, .inbox-head p { color: var(--text-3); font-size: 12.5px; margin-top: 3px; }
.asset-tabs { max-width:100%; min-width:0; display: flex; align-items: center; gap: 4px; padding: 4px; border-radius: var(--radius-sm); background: var(--bg-sunken); }
.asset-tabs button {
  display: inline-flex; align-items: center; gap: 6px; min-height: 32px; padding: 5px 10px;
  border: var(--border-w) solid transparent; border-radius: 7px; background: transparent;
  color: var(--text-2); font-size: 12.5px; font-weight: 650;
}
.asset-tabs button.active { color: var(--accent); background: var(--surface); border-color: var(--border); box-shadow: var(--shadow-card); }
.asset-tabs svg { width: 14px; height: 14px; }
.asset-tabs em { font-style: normal; color: var(--text-3); font-family: var(--font-mono); font-size: 10.5px; }
.asset-compact-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; margin-bottom: 12px; }
.asset-compact-head .asset-lens-row { margin-bottom: 0; }
.asset-head-actions { display: flex; gap: 8px; flex-shrink: 0; }
.fav-asset-meta { display: flex; gap: 4px; margin-top: 5px; overflow: hidden; }
.fav-asset-meta span {
  flex-shrink: 0; padding: 1px 5px; border-radius: 5px; background: var(--bg-sunken);
  color: var(--text-3); font-size: 9.5px; border: var(--border-w) solid var(--border);
}
.check-row { display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--text-2); }
.check-row input { accent-color: var(--accent); }

/* ---------- 收件箱 ---------- */
.inbox-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; margin-bottom: 12px; }
.inbox-pending {
  padding: 5px 10px; border-radius: 99px; border: var(--border-w) solid var(--border);
  background: var(--bg-sunken); color: var(--text-2); font-size: 11.5px; font-weight: 650;
}
.capture-bar { display: flex; align-items: stretch; gap: 8px; margin-bottom: 10px; }
.capture-bar textarea {
  flex: 1; min-width: 0; resize: vertical; max-height: 130px; padding: 10px 12px;
  border: var(--border-w) solid var(--border); border-radius: var(--radius-sm);
  background: var(--surface); color: var(--text); font: inherit; font-size: 13px; line-height: 1.55; outline: none;
}
.capture-bar textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.capture-bar .btn { min-width: 112px; justify-content: center; }
.inbox-import-message { margin: -2px 0 10px; color: var(--text-2); font-size: 12px; }
.inbox-capture-notice { margin: 0 0 10px; padding: 8px 10px; border: 1px solid var(--border); border-radius: 8px; color: var(--text-2); background: var(--surface); font-size: 12px; line-height: 1.5; }
.inbox-row-incomplete { color: var(--accent); font-size: 10px; }
.inbox-source-tabs { display: flex; gap: 5px; margin-bottom: 10px; border-bottom: var(--border-w) solid var(--border); }
.inbox-source-tabs button {
  display: inline-flex; align-items: center; gap: 6px; padding: 7px 10px;
  border-bottom: 2px solid transparent; color: var(--text-3); font-size: 12px; font-weight: 650;
}
.inbox-source-tabs button.active { border-bottom-color: var(--accent); color: var(--accent); }
.inbox-source-tabs span { color: var(--text-3); font-family: var(--font-mono); font-size: 10px; }
.inbox-filters { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
.inbox-filters button {
  display: inline-flex; align-items: center; gap: 7px; padding: 4px 9px; border-radius: 7px;
  border: var(--border-w) solid var(--border); background: transparent; color: var(--text-3); font-size: 11.5px;
}
.inbox-filters button.active { background: var(--surface); color: var(--accent); border-color: var(--accent); }
.inbox-filters span { font-family: var(--font-mono); font-size: 10px; }
.inbox-topic-filter { margin-left: auto; width: auto; min-width: 118px; padding: 4px 8px; font-size: 11.5px; }
.inbox-workspace {
  display: grid; grid-template-columns: minmax(270px, 350px) minmax(0, 1fr);
  min-height: 560px; height: calc(100vh - 218px);
  border: var(--border-w) solid var(--border); border-radius: var(--radius); overflow: hidden;
  background: var(--surface); box-shadow: var(--shadow-card);
}
.inbox-list { overflow-y: auto; padding: 8px; border-right: var(--border-w) solid var(--border); background: var(--bg-sunken); }
.inbox-list-empty { padding: 22px 12px; text-align: center; color: var(--text-3); font-size: 12px; }
.inbox-group-head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; padding: 10px 11px 4px; color: var(--text-2); }
.inbox-group-head strong { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; font-size: 11.5px; }
.inbox-group-head span { flex-shrink: 0; color: var(--text-3); font-size: 10px; }
.inbox-row {
  width: 100%; display: grid; gap: 5px; position: relative; padding: 10px 11px; margin-bottom: 6px;
  border-radius: var(--radius-sm); border: var(--border-w) solid transparent;
  background: transparent; color: var(--text); text-align: left;
}
.inbox-row:hover { background: color-mix(in oklch, var(--surface) 72%, transparent); }
.inbox-row.active { background: var(--surface); border-color: var(--border); box-shadow: var(--shadow-card); }
.inbox-row-top { display: flex; justify-content: space-between; gap: 8px; color: var(--text-3); font-size: 10.5px; }
.inbox-source { color: var(--accent); font-weight: 700; }
.inbox-row strong { padding-right: 58px; font-size: 13px; line-height: 1.4; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.inbox-row p { color: var(--text-3); font-size: 11.5px; line-height: 1.5; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.inbox-row-topic { color: var(--text-3); font-size: 10px; }
.inbox-type { position: absolute; right: 9px; top: 31px; padding: 1px 6px; border-radius: 5px; background: var(--bg-sunken); color: var(--text-3); font-size: 9.5px; }
.inbox-type.type-prompt { color: var(--accent); background: var(--accent-soft); }
.inbox-type.type-resource { color: oklch(57% 0.13 225); background: oklch(94% 0.035 225); }
.inbox-type.type-knowledge { color: oklch(55% 0.12 150); background: oklch(94% 0.035 150); }
.inbox-type.type-idea { color: oklch(55% 0.13 60); background: oklch(95% 0.035 60); }
.inbox-detail { min-width: 0; overflow-y: auto; padding: 18px 20px 22px; }
.inbox-detail-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; margin-bottom: 12px; }
.inbox-detail-actions { display: flex; flex-shrink: 0; flex-wrap: wrap; justify-content: flex-end; gap: 6px; white-space: nowrap; }
.inbox-detail-head span { color: var(--accent); font-size: 10.5px; font-weight: 700; }
.inbox-detail-head h2 { margin-top: 3px; font-family: var(--font-display); font-size: 17px; line-height: 1.4; }
.inbox-suggestion { margin: 0 0 10px; color: var(--accent); font-size: 11px; }
.inbox-evidence { padding: 12px 14px; margin-bottom: 16px; border-left: 3px solid var(--border); background: var(--bg-sunken); border-radius: 0 var(--radius-sm) var(--radius-sm) 0; }
.inbox-evidence p { color: var(--text-2); font-size: 12.5px; line-height: 1.75; white-space: pre-wrap; word-break: break-word; }
.inbox-evidence .inbox-author { color: var(--text-3); font-size: 10.5px; margin-bottom: 4px; }
.inbox-quoted-post { margin: 12px 0 0; padding: 10px 12px; border-left: 2px solid var(--accent); background: var(--bg-card); }
.inbox-quoted-post small { display: block; margin-bottom: 5px; color: var(--text-3); }
.inbox-organization { margin: -7px 0 10px; color: var(--accent); font-size: 11px; }
.inbox-media-gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 7px; margin: -6px 0 16px; }
.inbox-media-gallery button { position: relative; display: block; width: 100%; overflow: hidden; border-radius: var(--radius-sm); border: var(--border-w) solid var(--border); background: var(--bg-sunken); cursor: zoom-in; }
.inbox-media-gallery img { display: block; width: 100%; aspect-ratio: 4 / 3; object-fit: cover; }
.prompt-media-gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(115px, 1fr)); gap: 7px; margin: -8px 0 16px; }
.prompt-media-gallery a { display: block; overflow: hidden; border-radius: var(--radius-sm); border: var(--border-w) solid var(--border); }
.prompt-media-gallery img { display: block; width: 100%; aspect-ratio: 4 / 3; object-fit: cover; }
.dispatch-label { margin-bottom: 6px; color: var(--text-3); font-size: 11px; font-weight: 700; }
.dispatch-tabs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-bottom: 14px; }
.dispatch-tabs button {
  display: flex; justify-content: center; align-items: center; gap: 6px; min-height: 36px;
  border: var(--border-w) solid var(--border); border-radius: var(--radius-sm);
  background: var(--surface); color: var(--text-2); font-size: 12px; font-weight: 650;
}
.dispatch-tabs button.active { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }
.dispatch-tabs svg { width: 14px; height: 14px; }
.dispatch-form { display: grid; gap: 11px; }
.dispatch-form > label, .dispatch-form .field-grid > label, .knowledge-form label {
  display: grid; gap: 5px; color: var(--text-3); font-size: 11.5px; font-weight: 650;
}
.dispatch-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 14px; padding-top: 12px; border-top: var(--border-w) solid var(--border); }

/* X 收藏沿用信息流时间线，详情在需要时从右侧打开。 */
.inbox-x-toolbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 1px 0 12px; color: var(--text-3); font-size: 11.5px; }
.inbox-x-toolbar small { color: var(--text-3); font-size: 10.5px; }
.inbox-x-toolbar > div { display: flex; align-items: center; gap: 8px; }
.inbox-x-toolbar .select { width: auto; min-width: 168px; padding: 6px 9px; font-size: 11.5px; }
.inbox-x-toolbar .btn { min-height: 32px; padding: 5px 10px; font-size: 11.5px; }
.inbox-review-panel { padding: 10px 12px; margin-bottom: 12px; border: var(--border-w) solid var(--border); border-radius: var(--radius-sm); background: var(--surface); }
.inbox-review-panel p { margin-bottom: 8px; color: var(--text-2); font-size: 11.5px; line-height: 1.6; }
.inbox-review-filters { display: flex; flex-wrap: wrap; gap: 6px; }
.inbox-review-filters button { padding: 4px 8px; border-radius: 6px; border: var(--border-w) solid var(--border); color: var(--text-2); font-size: 11px; }
.inbox-review-filters button.active { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); }
.inbox-review-filters span { font-family: var(--font-mono); color: var(--text-3); }
.inbox-workspace.x-mode { display: block; height: auto; min-height: 0; overflow: visible; border: 0; border-radius: 0; background: transparent; box-shadow: none; }
.inbox-workspace.x-mode .inbox-list { overflow: visible; max-height: none; padding: 0; border: 0; background: transparent; }
.inbox-workspace.x-mode .feed-day-label { background: var(--bg); }
.inbox-tl-row { grid-template-columns: 46px 18px minmax(0, 1fr); }
.inbox-timeline-card { width: calc(100% - 4px); min-width: 0; margin-bottom: 10px; text-align: left; cursor: pointer; }
.inbox-card-open { position: absolute; inset: 0; z-index: 1; width: 100%; border: 0; border-radius: inherit; background: transparent; cursor: pointer; }
.inbox-card-open:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.inbox-timeline-card .feed-corner { pointer-events: none; }
.inbox-timeline-card .feed-body { display: block; padding-right: 37px; pointer-events: none; }
.inbox-timeline-card .feed-title { display: block; overflow: visible; white-space: normal; overflow-wrap: anywhere; }
.inbox-card-excerpt { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; margin-top: 5px; color: var(--text-3); font-size: 12px; line-height: 1.6; overflow-wrap: anywhere; }
.inbox-card-excerpt b { margin-right: 7px; color: var(--text-2); font-size: 11px; font-weight: 700; }
.inbox-card-media { position: relative; z-index: 2; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; width: 100%; max-width: 600px; margin-top: 12px; pointer-events: auto; }
.inbox-card-media--1 { grid-template-columns: 1fr; max-width: 440px; }
.inbox-card-media-cell { position: relative; display: block; width: 100%; aspect-ratio: 4 / 3; overflow: hidden; border: var(--border-w) solid var(--border); border-radius: var(--radius-sm); background: var(--bg-sunken); cursor: zoom-in; }
.inbox-card-media-cell img { display: block; width: 100%; height: 100%; object-fit: contain; }
.inbox-card-media-play { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); display: grid; place-items: center; width: 42px; height: 42px; border-radius: 50%; background: rgb(0 0 0 / .75); color: #fff; font-size: 19px; }
.inbox-card-media-more { position: absolute; right: 5px; bottom: 5px; padding: 2px 6px; border-radius: 5px; background: rgb(0 0 0 / .7); color: white; font-size: 11px; font-weight: 700; }
.inbox-media-overlay { position: fixed; inset: 0; z-index: 90; padding: 16px; background: rgb(0 0 0 / .86); }
.inbox-media-viewer { display: grid; grid-template-rows: 32px minmax(0, 1fr); gap: 12px; width: 100%; height: 100%; min-width: 0; min-height: 0; color: white; }
.inbox-media-viewer:focus { outline: none; }
.inbox-media-viewer-toolbar { display: flex; align-items: center; justify-content: space-between; justify-self: center; width: min(1200px, 100%); font-size: 13px; }
.inbox-media-viewer-actions { display: flex; align-items: center; gap: 8px; }
.inbox-media-viewer-toolbar button { display: grid; place-items: center; min-height: 32px; padding: 0 10px; border: 1px solid rgb(255 255 255 / .28); border-radius: 7px; background: rgb(16 16 16 / .72); color: white; font-size: 12px; line-height: 1; appearance: none; }
.inbox-media-viewer-toolbar button:last-child { width: 32px; padding: 0; border-radius: 50%; }
.inbox-media-viewer-toolbar button svg { width: 17px; height: 17px; }
.inbox-media-viewer button:focus-visible, .inbox-media-stage:focus-visible { outline: 2px solid rgb(255 255 255 / .9); outline-offset: 3px; }
.inbox-media-viewer button:hover { background: rgb(48 48 48 / .94); }
.inbox-media-viewer-content { position: relative; justify-self: center; width: min(1200px, 100%); min-width: 0; min-height: 0; }
.inbox-media-stage { display: grid; grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(0, 1fr); place-items: center; width: 100%; height: 100%; min-width: 0; min-height: 0; overflow: hidden; }
.inbox-media-full, .inbox-media-viewer video { display: block; max-width: min(1100px, 100%); max-height: 100%; object-fit: contain; }
.inbox-media-stage.has-navigation:not(.is-zoomed) .inbox-media-full,
.inbox-media-stage.has-navigation:not(.is-zoomed) video { max-width: calc(100% - 96px); }
.inbox-media-viewer video { width: 900px; }
.inbox-media-stage.is-zoomed { display: block; overflow: auto; cursor: grab; }
.inbox-media-stage.is-zoomed:active { cursor: grabbing; }
.inbox-media-stage.is-zoomed .inbox-media-full { width: auto; height: auto; max-width: none; max-height: none; margin: auto; user-select: none; }
.inbox-media-unavailable { display: grid; justify-items: center; gap: 8px; max-height: 100%; overflow: auto; text-align: center; font-size: 13px; }
.inbox-media-unavailable img { display: block; max-width: 100%; max-height: calc(100vh - 185px); object-fit: contain; }
.inbox-media-unavailable a { color: #8ebfff; text-decoration: underline; }
.inbox-media-viewer-nav { position: absolute; inset: 0; pointer-events: none; }
.inbox-media-viewer-nav button { position: absolute; top: 50%; display: grid; place-items: center; width: 42px; height: 42px; padding: 0 0 3px; transform: translateY(-50%); border: 1px solid rgb(255 255 255 / .32); border-radius: 50%; background: rgb(16 16 16 / .82); color: white; font-family: Arial, sans-serif; font-size: 30px; line-height: 1; pointer-events: auto; }
.inbox-media-prev { left: 0; }
.inbox-media-next { right: 0; }
@media (max-width: 640px) {
  .inbox-media-overlay { padding: 12px; }
  .inbox-media-stage.has-navigation:not(.is-zoomed) .inbox-media-full,
  .inbox-media-stage.has-navigation:not(.is-zoomed) video { max-width: 100%; }
  .inbox-media-prev { left: 4px; }
  .inbox-media-next { right: 4px; }
}
.inbox-card-meta { margin-top: 9px; }
.inbox-card-author { color: var(--text-3); font-size: 10.5px; }
.inbox-type-chip.type-prompt { color: var(--accent); background: var(--accent-soft); }
.inbox-type-chip.type-resource { color: oklch(57% 0.13 225); }
.inbox-type-chip.type-knowledge { color: oklch(55% 0.12 150); }
.inbox-review-chip { color: var(--accent) !important; border-color: var(--accent) !important; }
.inbox-subject-badge { color: var(--accent); border-color: var(--accent); background: var(--accent-soft); }
.inbox-x-toolbar .select[aria-label="按跨作者主题合集筛选 X 收藏"] { max-width: 210px; }
.inbox-load-more { display: flex; margin: 9px auto 24px; }
.inbox-drawer .inbox-detail-head { flex-wrap: wrap; }
.inbox-drawer .inbox-detail-head > div:first-child { flex: 1 1 280px; min-width: 0; }
.inbox-drawer .inbox-detail-head h2 { margin-top: 0; overflow-wrap: anywhere; }
.inbox-drawer .inbox-detail-actions { flex: 0 1 auto; }
.inbox-digest-block { margin: 0 0 16px; padding: 12px 14px; border: var(--border-w) solid var(--border); border-radius: var(--radius-sm); background: var(--surface); }
.inbox-digest-block > strong { display: block; margin-bottom: 5px; color: var(--text-2); font-size: 11px; }
.inbox-digest-block > p { margin: 0; color: var(--text); font-size: 12px; line-height: 1.7; overflow-wrap: anywhere; }
.inbox-evidence a, .inbox-extracted-links a { color: var(--accent); text-decoration: underline; text-underline-offset: 2px; overflow-wrap: anywhere; }
.inbox-extracted-links, .inbox-related-posts { display: grid; gap: 7px; margin: -6px 0 16px; font-size: 11.5px; }
.inbox-extracted-links strong, .inbox-related-posts strong { color: var(--text-2); }
.inbox-extracted-links a { line-height: 1.55; }
.inbox-related-posts { margin-top: 0; padding: 10px 12px; border: var(--border-w) solid var(--border); border-radius: var(--radius-sm); background: var(--bg-sunken); }
.inbox-related-posts button { padding: 5px 0; color: var(--text-2); text-align: left; line-height: 1.5; border-bottom: var(--border-w) solid var(--border); }
.inbox-related-posts button:last-child { border-bottom: 0; }
.inbox-related-posts button:hover { color: var(--accent); }
.inbox-review-note { margin: 0 0 14px; padding: 9px 11px; border-left: 2px solid var(--accent); border-radius: 0 7px 7px 0; background: var(--accent-soft); color: var(--text-2); font-size: 11.5px; line-height: 1.6; }
.inbox-review-note a { color: var(--accent); text-decoration: underline; text-underline-offset: 2px; }

.fav-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(186px, 1fr)); gap: 9px; margin-bottom: 18px; }
.fav-card {
  position: relative; display: flex; align-items: center; gap: 10px;
  padding: 9px 11px; border-radius: var(--radius-sm);
  border: var(--border-w) solid var(--border);
  background: var(--surface); text-decoration: none; color: inherit;
  box-shadow: var(--shadow-card);
  backdrop-filter: var(--glass); -webkit-backdrop-filter: var(--glass);
  transition: transform .2s ease, box-shadow .2s ease, border-color .2s ease;
}
.fav-card:hover { transform: translateY(-2px); box-shadow: var(--shadow-pop); border-color: var(--accent); }
.fav-avatar {
  width: 30px; height: 30px; border-radius: 8px; flex-shrink: 0;
  display: grid; place-items: center; overflow: hidden;
  font-family: var(--font-display); font-weight: 800; font-size: 13px; color: #fff;
  transition: transform .2s ease;
}
.fav-card:hover .fav-avatar { transform: scale(1.08); }
.fav-avatar img { width: 19px; height: 19px; border-radius: 4px; }
.fav-body { min-width: 0; flex: 1; }
.fav-name-row { display: flex; align-items: center; gap: 4px; }
.fav-name { font-weight: 650; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; transition: color .18s; }
.fav-card:hover .fav-name { color: var(--accent); }
.fav-arrow { width: 12px; height: 12px; flex-shrink: 0; color: var(--text-3); transition: transform .2s, color .2s; }
.fav-card:hover .fav-arrow { transform: translate(2px, -2px); color: var(--accent); }
.fav-desc {
  font-size: 11.5px; color: var(--text-3); line-height: 1.5;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}

.card-del, .card-edit {
  position: absolute; top: 8px; right: 8px; z-index: 2;
  width: 26px; height: 26px; border-radius: 8px;
  display: grid; place-items: center;
  border: none; background: var(--raised); color: var(--text-3);
  opacity: 0; transition: all .15s ease;
}
.card-edit { right: 38px; }
.fav-card:hover .card-del, .prompt-card:hover .card-del,
.fav-card:hover .card-edit, .prompt-card:hover .card-edit { opacity: 1; }
.card-del:hover { color: oklch(60% 0.22 25); background: var(--bg-sunken); }
.card-edit:hover { color: var(--accent); background: var(--bg-sunken); }
.card-del svg, .card-edit svg { width: 13px; height: 13px; }

.fav-add {
  display: flex; align-items: center; justify-content: center; gap: 8px; min-height: 70px;
  border: var(--border-w) dashed var(--border); border-radius: var(--radius);
  background: transparent; color: var(--text-3); font-size: 13px; font-weight: 600;
  transition: all .18s ease;
}
.fav-add:hover { color: var(--accent); border-color: var(--accent); background: var(--accent-soft); }
.fav-add svg { width: 18px; height: 18px; }

/* ---------- 提示词工具栏（筛选 + 操作合并为一行） ---------- */
.prompt-toolbar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
.prompt-toolbar .toolbar-actions { margin-left: auto; display: flex; gap: 8px; flex-shrink: 0; }
.select-mini {
  padding: 5px 28px 5px 10px; border-radius: 8px; font-size: 12px; font-weight: 600;
  border: var(--border-w) solid var(--border); background: var(--surface); color: var(--text-2);
  outline: none; appearance: auto; cursor: pointer;
}
.prompt-pipeline { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.pipeline-card { cursor: pointer; transition: border-color .18s, background .18s, transform .18s; }
.pipeline-card:hover { transform: translateY(-1px); border-color: var(--accent); }
.pipeline-card.active {
  border-color: color-mix(in oklch, var(--accent) 62%, var(--border));
  background: color-mix(in oklch, var(--accent-soft) 38%, var(--surface));
}

/* ---------- 提示词卡片：等高网格 ---------- */
.prompt-group { margin-bottom: 18px; }
.prompt-group .section-head { margin-bottom: 8px; }
.prompt-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 280px), 1fr)); gap: 10px; align-items: stretch; }
.prompt-card {
  position: relative; display: flex; flex-direction: column; cursor: pointer;
  border-radius: var(--radius); overflow: hidden;
  border: var(--border-w) solid var(--border);
  background: var(--surface); box-shadow: var(--shadow-card);
  backdrop-filter: var(--glass); -webkit-backdrop-filter: var(--glass);
  transition: transform .2s ease, box-shadow .2s ease, border-color .2s ease;
}
.prompt-card:hover { transform: translateY(-3px); box-shadow: var(--shadow-pop); border-color: var(--accent); }
.prompt-asset-card { min-width:0; }
.prompt-cover { width: 100%; aspect-ratio: 4 / 3; object-fit: cover; display: block; background: var(--bg-sunken); }
.prompt-cover-placeholder {
  width: 100%; aspect-ratio: 4 / 3;
  display: grid; place-items: center;
  background: var(--accent-soft);
}
.prompt-cover-placeholder svg { width: 30px; height: 30px; color: var(--accent); }
.prompt-body { padding: 9px 11px 10px; display: flex; flex-direction: column; gap: 5px; flex: 1; }
.prompt-card-top { display: flex; align-items: center; gap: 6px; min-height: 22px; }
.asset-score {
  display: inline-grid; place-items: center; min-width: 30px; height: 20px;
  border-radius: 7px; background: var(--bg-sunken); border: var(--border-w) solid var(--border);
  font-family: var(--font-mono); font-size: 11px; font-weight: 800; color: var(--text-2);
}
.asset-score.high { color: oklch(58% 0.15 155); background: oklch(94% 0.035 155); }
.asset-score.low { color: oklch(58% 0.16 38); background: oklch(94% 0.035 38); }
.review-chip {
  border-radius: 7px; padding: 1px 7px; font-size: 10.5px; font-weight: 700;
  background: color-mix(in oklch, var(--accent-soft) 70%, var(--surface)); color: var(--accent);
}
.review-chip.muted { color: var(--text-3); background: var(--bg-sunken); }
.prompt-card-top .star-btn { margin-left: auto; }
.prompt-title {
  font-family: var(--font-display); font-weight: var(--display-weight); font-size: 13px; line-height: 1.4;
  display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; overflow: hidden;
}
.prompt-text {
  font-size: 11.5px; color: var(--text-3); line-height: 1.55;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  word-break: break-word; min-height: 2.6em;
}
.prompt-meta { display: flex; align-items: center; gap: 5px; flex-wrap: wrap; margin-top: auto; padding-top: 2px; }
.variable-row { display: flex; gap: 5px; flex-wrap: wrap; }
.variable-chip {
  border-radius: 6px; padding: 1px 6px;
  border: var(--border-w) solid var(--border); background: var(--bg-sunken);
  color: var(--text-3); font-size: 10.5px; font-family: var(--font-mono);
}
.prompt-actions { display: flex; flex-wrap:wrap; gap: 6px; margin-top:8px; }
.tag-chip, .model-chip, .sns-chip { flex-shrink: 0; }
.tag-chip {
  border-radius: 99px; padding: 1px 9px; font-size: 11px; font-weight: 600;
  background: var(--accent-soft); color: var(--accent); white-space: nowrap;
}
.prompt-copy {
  flex: 1 0 auto; display: inline-flex; align-items: center; justify-content: center; gap: 5px;
  border: var(--border-w) solid var(--border); border-radius: 8px;
  padding: 5px 10px; font-size: 12px; font-weight: 600; white-space: nowrap;
  background: transparent; color: var(--text-2);
  transition: all .18s;
}
.prompt-copy:hover { background: var(--accent-soft); color: var(--accent); border-color: var(--accent); }
.prompt-copy svg { width: 13px; height: 13px; flex-shrink: 0; }

/* ---------- 信息流 ---------- */
.feed-sources { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
.feed-source {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 6px 13px; border-radius: var(--radius-sm); font-size: 13px; font-weight: 600;
  border: var(--border-w) solid var(--border); background: var(--surface); color: var(--text-2);
  transition: all .18s ease;
}
.feed-source:hover { color: var(--accent); border-color: var(--accent); }
.feed-source.active { background: var(--accent); color: var(--accent-contrast); border-color: var(--accent); }
[data-skin="playful"] .feed-source.active { border-color: var(--border); }
.feed-source .src-cat {
  font-size: 10px; font-weight: 700; padding: 0 6px; border-radius: 99px;
  background: var(--accent-soft); color: var(--accent);
}
.feed-source.active .src-cat { background: oklch(100% 0 0 / .25); color: var(--accent-contrast); }

.feed-layout { display: grid; grid-template-columns: 1fr 252px; gap: 12px; align-items: start; }
@media (max-width: 1020px) { .feed-layout { grid-template-columns: 1fr; } }
.feed-list { display: flex; flex-direction: column; gap: 7px; }
.feed-layout-loading {
  grid-template-columns: 1fr;
  min-height: calc(100vh - 118px);
}
.feed-list-loading {
  min-height: calc(100vh - 118px);
}
.feed-loading-empty {
  flex: 1 1 auto;
  min-height: calc(100vh - 118px);
  display: grid;
  place-items: center;
  border: var(--border-w) solid var(--border);
  border-radius: var(--radius-sm);
  background: var(--surface);
  box-shadow: var(--shadow-card);
}
.feed-inline-error {
  display: flex;
  align-items: center;
  min-height: 44px;
  padding: 8px 12px;
  border: var(--border-w) solid var(--border);
  border-radius: var(--radius-sm);
  background: var(--surface);
  color: var(--text-2);
  box-shadow: var(--shadow-card);
}
.feed-refresh-banner {
  display: grid;
  place-items: center;
  align-self: center;
  width: fit-content;
  height: 70px;
  box-sizing: border-box;
  padding: 6px 0;
  color: var(--accent);
  overflow: hidden;
  opacity: 1;
  transform: scale(1);
  transform-origin: top center;
}
.feed-refresh-banner.closing {
  height: 0;
  padding-top: 0;
  padding-bottom: 0;
  margin-bottom: -7px;
  opacity: 0;
  transform: scale(.72);
}
.feed-refresh-banner .rose-four-loader {
  display: grid;
  grid-template-columns: 1fr;
  gap: 0;
}
.feed-refresh-banner .rose-four-svg {
  width: 58px;
  height: 58px;
}
.feed-inline-error {
  font-size: 12px;
  border-color: oklch(70% 0.14 30 / .45);
  background: oklch(97% 0.025 35 / .75);
  color: oklch(42% 0.1 30);
}
[data-theme="dark"] .feed-inline-error {
  background: oklch(28% 0.055 35 / .65);
  color: oklch(82% 0.06 40);
}
.rose-four-loader {
  display: inline-grid;
  grid-template-columns: auto auto;
  align-items: center;
  justify-content: center;
  gap: 10px;
  color: var(--accent);
}
.feed-loading-empty .rose-four-loader {
  grid-template-columns: 1fr;
  justify-items: center;
  gap: 12px;
}
.rose-four-svg {
  width: 34px;
  height: 34px;
  overflow: visible;
  filter: drop-shadow(0 0 10px oklch(65% 0.18 258 / .22));
}
.feed-loading-empty .rose-four-svg {
  width: 78px;
  height: 78px;
}
.rose-four-label {
  color: var(--text-2);
  font-size: 12px;
  font-weight: 650;
  white-space: nowrap;
}
.feed-card {
  position: relative;
  display: flex; gap: 11px; align-items: flex-start;
  padding: 11px 13px; border-radius: var(--radius-sm);
  border: var(--border-w) solid var(--border);
  background: var(--surface); box-shadow: 0 1px 2px rgb(0 0 0 / .025);
  backdrop-filter: var(--glass); -webkit-backdrop-filter: var(--glass);
  transition: transform .18s ease, box-shadow .18s ease, border-color .18s ease;
  text-decoration: none; color: inherit;
}
.feed-card:hover { transform: none; box-shadow: none; border-color: color-mix(in srgb,var(--accent) 30%,var(--border)); }
.feed-rank {
  font-family: var(--font-mono); font-size: 12.5px; font-weight: 700;
  color: var(--text-3); width: 20px; flex-shrink: 0; text-align: center; padding-top: 2px;
}
.feed-rank.hot { color: var(--accent); }
.feed-body { flex: 1; min-width: 0; }
.feed-title-row { display: flex; align-items: flex-start; gap: 8px; padding-right: 38px; }
.feed-title { flex: 1; min-width: 0; font-weight: 650; font-size: 14.5px; line-height: 1.5; transition: color .18s; }
.feed-card:hover .feed-title { color: var(--accent); }
.feed-save {
  width: 26px; height: 26px; margin-top: -2px; flex-shrink: 0; display: grid; place-items: center;
  border: var(--border-w) solid var(--border); border-radius: 7px; background: var(--surface); color: var(--text-3);
  opacity: 0; transform: translateY(2px); transition: opacity .18s, transform .18s, color .18s, border-color .18s;
}
.feed-card:hover .feed-save, .feed-save:focus-visible { opacity: 1; transform: none; }
.feed-save:hover { color: var(--accent); border-color: var(--accent); background: var(--accent-soft); }
.feed-save svg { width: 13px; height: 13px; }
.feed-corner { position: absolute; top: 0; right: 0; z-index: 1; display: flex; align-items: center; }
.feed-score {
  display: grid; place-items: center; min-width: 26px; height: 21px; padding: 0 9px;
  border-radius: 0 var(--radius-sm) 0 16px;
  background: var(--bg-sunken); color: var(--text-2);
  font-family: var(--font-mono); font-size: 11px; font-weight: 700;
}
/* 多标签 + 关联讨论 */
.feed-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; align-items: center; }
.feed-tags .tag-chip {
  background: var(--label-bg); color: var(--text-2); font-weight: 500; font-size: var(--label-size);
  border: var(--border-w) solid var(--border);
}
.feed-related {
  font-size: 10px; color: var(--text-3); padding: 1px 8px; border-radius: 6px; white-space: nowrap;
  border: var(--border-w) dashed var(--border);
}
/* 推荐理由框 */
.feed-reason {
  margin-top: 9px; padding: 8px 11px; font-size: 12px; line-height: 1.65;
  color: var(--text-2); background: color-mix(in srgb,var(--accent) 4%,var(--surface));
  border-left: 2px solid color-mix(in srgb,var(--accent) 35%,var(--border)); border-radius: 0 6px 6px 0;
}
.feed-reason-label {
  display: inline-block; font-weight: 700; color: var(--accent); margin-right: 6px; font-size: 11.5px;
}
.feed-origin {
  display: inline-flex; align-items: center; gap: 5px;
  overflow: hidden; white-space: nowrap; max-width: 230px;
  font-size: 10px; color: var(--text-3); margin-left: auto; padding-left: 6px;
}
.feed-avatar { width: 15px; height: 15px; border-radius: 50%; flex-shrink: 0; object-fit: cover; }
/* 配图缩略图 */
.feed-imgs { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
.feed-img {
  width: 268px; height: 184px; object-fit: cover; border-radius: var(--radius-sm);
  border: var(--border-w) solid var(--border); cursor: zoom-in; background: var(--bg-sunken);
  transition: transform .15s ease, border-color .15s ease;
}
.feed-img:hover { transform: scale(1.02); border-color: var(--accent); }
/* 图片放大悬浮层 */
.lightbox {
  position: fixed; inset: 0; z-index: 1000;
  display: grid; place-items: center; padding: 40px;
  background: oklch(0% 0 0 / .8); backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
  animation: lb-fade .15s ease;
}
@keyframes lb-fade { from { opacity: 0; } }
.lightbox-img {
  max-width: 92vw; max-height: 88vh; border-radius: var(--radius);
  box-shadow: 0 20px 60px oklch(0% 0 0 / .5); cursor: zoom-out;
}
.lightbox-close {
  position: fixed; top: 20px; right: 24px; width: 38px; height: 38px;
  border-radius: 50%; border: none; cursor: pointer; line-height: 1;
  background: oklch(100% 0 0 / .15); color: #fff; font-size: 17px;
  transition: background .15s ease;
}
.lightbox-close:hover { background: oklch(100% 0 0 / .3); }

/* 时间线：按日期分组 */
.feed-day { margin-bottom: 0; }
.feed-day + .feed-day { margin-top: 3px; }
.feed-day-label {
  position: relative;
  font-size: 12px; font-weight: 700; color: var(--text-2);
  padding: 6px 2px 8px; z-index: 1; background: var(--bg);
}
/* 日期标签处补一段竖线，连接上下两天的时间线（首个分组除外） */
.feed-day:not(:first-child) .feed-day-label::before {
  content: ""; position: absolute; top: -3px; bottom: 0; left: 59px;
  width: 2px; transform: translateX(-50%); background: var(--border);
}
.feed-day .feed-card { margin-bottom: 0; }

/* 时间线列：左侧大字时间 + 圆点 + 连续竖线，右侧卡片 */
.timeline { display: flex; flex-direction: column; }
.tl-row { display: grid; grid-template-columns: 46px 18px 1fr; column-gap: 4px; align-items: stretch; }
.tl-time {
  font-family: var(--font-mono); font-size: 13px; font-weight: 700;
  color: var(--text-2); text-align: right; padding: 2px 2px 0 0; white-space: nowrap;
}
.tl-rail { position: relative; display: flex; justify-content: center; }
.tl-rail::before {
  content: ""; position: absolute; top: 0; bottom: 0; left: 50%;
  width: 2px; transform: translateX(-50%); background: var(--border);
}
.feed-day:first-child .tl-row:first-child .tl-rail::before { top: 7px; }
.tl-dot {
  position: relative; z-index: 1; margin-top: 3px;
  width: 9px; height: 9px; border-radius: 50%;
  background: var(--accent); box-shadow: 0 0 0 3px var(--bg), 0 0 6px var(--accent);
}
.tl-row .feed-card { flex: 1; margin: 0 0 9px 4px; }
.tl-row:hover .tl-dot { box-shadow: 0 0 0 3px var(--bg), 0 0 10px var(--accent); }
@media (max-width: 560px) {
  .tl-row { grid-template-columns: 40px 14px 1fr; }
  .tl-time { font-size: 12px; }
}
.feed-summary {
  font-size: 12.5px; color: var(--text-3); line-height: 1.65; margin-top: 4px;
  word-break: break-word;
}
.feed-meta { display: flex; gap: 8px; margin-top: 5px; font-size: 11px; color: var(--text-3); flex-wrap: wrap; align-items: center; }
.feed-heat { font-family: var(--font-mono); font-size: 11px; color: var(--text-3); flex-shrink: 0; padding-top: 2px; }
.feed-side { display: flex; flex-direction: column; gap: 12px; margin-top: 31px; }
@media (max-width: 1020px) { .feed-side { margin-top: 0; } }
.hot-card {
  padding: 14px 16px; border-radius: var(--radius);
  border: var(--border-w) solid var(--border);
  background: var(--surface); box-shadow: var(--shadow-card);
  backdrop-filter: var(--glass); -webkit-backdrop-filter: var(--glass);
}
.hot-title { font-family: var(--font-display); font-weight: var(--display-weight); font-size: 14px; margin-bottom: 10px; }
.hot-item {
  display: flex; align-items: flex-start; gap: 8px; padding: 7px 0;
  text-decoration: none; color: inherit; border-top: var(--border-w) solid var(--border);
}
.hot-item:first-of-type { border-top: none; }
.hot-rank {
  flex-shrink: 0; width: 17px; height: 17px; border-radius: 5px; margin-top: 1px;
  display: grid; place-items: center; font-size: 11px; font-weight: 700;
  background: var(--bg-sunken); color: var(--text-3);
}
.hot-rank.r1 { background: oklch(70% 0.18 30); color: #fff; }
.hot-rank.r2 { background: oklch(72% 0.13 50); color: #fff; }
.hot-rank.r3 { background: oklch(74% 0.10 70); color: #fff; }
.hot-text { flex: 1; min-width: 0; font-size: 12.5px; line-height: 1.5; transition: color .18s;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.hot-item:hover .hot-text { color: var(--accent); }
.hot-score { flex-shrink: 0; font-family: var(--font-mono); font-size: 11px; font-weight: 700; color: var(--accent); margin-top: 1px; }

@media (min-width: 1021px) {
  .aihot-feed { display:flex; flex-direction:column; height:calc(100dvh - 112px - var(--border-w)); min-height:0; }
  .aihot-feed > .feed-toolbar, .aihot-feed > .feed-sources { flex-shrink:0; }
  .aihot-feed .feed-layout { flex:1; min-height:0; grid-template-columns:minmax(0,1fr) 252px; align-items:stretch; }
  .aihot-feed .feed-layout-loading { grid-template-columns:1fr; }
  .aihot-feed .feed-list { min-height:0; min-width:0; overflow-y:auto; overscroll-behavior-y:contain; scrollbar-gutter:stable; padding:2px 4px 4px 0; }
  .aihot-feed .feed-list > * { flex-shrink:0; }
  .aihot-feed .feed-list:focus-visible { outline:2px solid var(--accent); outline-offset:-2px; }
  .aihot-feed .feed-side { min-height:0; overflow-y:auto; overscroll-behavior-y:contain; }
  .aihot-feed .hot-card { flex-shrink:0; }
}

/* 木鱼（侧边栏底部，个人信息上方） */
.woodfish-box {
  position: relative; margin: 2px 0 8px; padding: 16px 13px 12px; border-radius: var(--radius-sm);
  background: var(--bg-sunken); border: var(--border-w) solid var(--border);
}
.wf-quote-mark {
  position: absolute; top: 3px; left: 10px;
  font-family: Georgia, "Times New Roman", serif; font-size: 30px; line-height: 1;
  color: var(--text-3); opacity: .3;
}
.woodfish-quote {
  position: relative; font-size: 12px; line-height: 1.7; color: var(--text-2); padding-left: 3px;
  display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;
}
.wf-foot { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 8px; }
.wf-merit { flex-shrink: 0; font-family: var(--font-mono); font-size: 10.5px; color: var(--text-3); }
.woodfish-from {
  min-width: 0; font-size: 10px; color: var(--text-3);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
/* 敲击波纹扩散 */
.wf-ripple {
  position: absolute; left: 50%; top: 57%; width: 34px; height: 34px;
  margin: -17px 0 0 -17px; border-radius: 50%;
  border: 1.5px solid oklch(72% 0.13 85); pointer-events: none;
  /* 加速扩散：越往外圈间距越大（越稀），配合透明度递减；时长与功德文字一致 */
  animation: wf-ripple .85s cubic-bezier(.3,0,.6,.4) forwards;
}
@keyframes wf-ripple {
  0% { transform: scale(.28); opacity: .6; }
  60% { opacity: .28; }
  100% { transform: scale(3.4); opacity: 0; }
}
/* 悬浮木鱼（可拖动，无背景，仅图标） */
.wf-float {
  position: fixed; z-index: 80; width: 52px; height: 50px;
  display: grid; place-items: center; cursor: grab;
  touch-action: none; user-select: none; -webkit-user-select: none;
  transition: opacity .3s ease, transform .36s cubic-bezier(.3, 1, .3, 1), filter .3s ease;
}
.wf-float.hidden {
  opacity: 0;
  transform: translateX(-14px) scale(.72);
  filter: blur(4px);
  pointer-events: none;
}
.wf-float:active { cursor: grabbing; }
/* 鼠标进入木鱼时隐藏系统光标，由木锤代替 */
.wf-float.hover { cursor: none; }
/* 参照电子木鱼：木鱼为基准，敲击时缩小；木槌跟随鼠标，手柄尾端为支点旋转落锤 */
.wf-body {
  position: absolute; left: 0; bottom: 0; width: 50px; height: auto; display: block;
  filter: drop-shadow(0 3px 6px oklch(0% 0 0 / .32)); -webkit-user-drag: none; user-drag: none;
}
.wf-mallet {
  position: absolute; width: 42px; height: auto; display: block;
  /* 锤头位于图片左侧约 20%，让锤头对准鼠标光标点；旋转支点保持在手柄尾端 */
  transform-origin: 100% 100%;
  transform: translate(-20%, -35%) rotate(0deg);
  pointer-events: none;
  filter: drop-shadow(0 2px 4px oklch(0% 0 0 / .35)); -webkit-user-drag: none; user-drag: none;
  z-index: 1;
}
.wf-float.knock .wf-mallet { animation: mallet-hit .22s cubic-bezier(.5,.35,.15,1.4); }
@keyframes mallet-hit {
  0% { transform: translate(-20%, -35%) rotate(0deg); }
  50% { transform: translate(-20%, -35%) rotate(28deg); }
  100% { transform: translate(-20%, -35%) rotate(0deg); }
}
.wf-float.knock .wf-body { animation: wf-body-bop .2s cubic-bezier(.5,.35,.15,1.4); }
@keyframes wf-body-bop {
  50% { transform: scale(.92); }
}
.woodfish-tap {
  position: relative; width: 100%; margin-top: 8px;
  display: flex; align-items: center; justify-content: center;
  padding: 4px; background: none; border: none; cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}
.woodfish-icon { display: grid; place-items: center; transition: transform .14s ease; }
.woodfish-icon svg { width: 46px; height: 46px; filter: drop-shadow(0 2px 4px oklch(0% 0 0 / .18)); }
.woodfish-tap:hover .woodfish-icon { transform: scale(1.04); }
.woodfish-tap.knock .woodfish-icon { animation: woodfish-bop .32s ease; }
@keyframes woodfish-bop {
  0% { transform: scale(1) translateY(0); }
  35% { transform: scale(0.8) translateY(6px); }
  65% { transform: scale(1.05) translateY(-1px); }
  100% { transform: scale(1) translateY(0); }
}
.merit-pop {
  position: absolute; left: 50%; top: -2px; transform: translateX(-50%);
  font-size: 13px; font-weight: 700; color: oklch(78% 0.15 80); pointer-events: none;
  white-space: nowrap; text-shadow: 0 1px 3px oklch(45% 0.12 70 / .4);
  animation: merit-float .85s ease-out forwards;
}
@keyframes merit-float {
  0% { opacity: 0; transform: translateX(-50%) translateY(6px) scale(.7); }
  25% { opacity: 1; }
  100% { opacity: 0; transform: translateX(-50%) translateY(-34px) scale(1.1); }
}

.quote-card {
  padding: 14px 16px; border-radius: var(--radius);
  border: var(--border-w) solid var(--border);
  background: var(--surface); box-shadow: var(--shadow-card);
  backdrop-filter: var(--glass); -webkit-backdrop-filter: var(--glass);
}
.quote-mark { font-family: var(--font-display); font-size: 30px; line-height: 1; color: var(--accent); display: block; }
.quote-text { font-family: var(--font-display); font-size: 13.5px; line-height: 1.75; margin: 4px 0 8px; }
.quote-from { font-size: 11.5px; color: var(--text-3); text-align: right; }

/* ---------- 工具箱 ---------- */
.tool-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(285px, 1fr)); gap: 10px; }
.tool-workflow {
  display: grid; grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 10px; margin-bottom: 12px;
}
.workflow-card {
  display: flex; align-items: center; gap: 11px;
  padding: 12px 14px; border-radius: var(--radius-sm);
  border: var(--border-w) solid var(--border);
  background: var(--surface); box-shadow: var(--shadow-card);
}
.workflow-card > span {
  width: 34px; height: 34px; flex-shrink: 0; border-radius: 9px;
  display: grid; place-items: center; background: var(--accent-soft); color: var(--accent);
}
.workflow-card svg { width: 17px; height: 17px; }
.workflow-card strong { display: block; font-size: 13.5px; line-height: 1.3; }
.workflow-card p { color: var(--text-3); font-size: 12px; line-height: 1.45; margin-top: 2px; }
.tools-board {
  display: grid; grid-template-columns: minmax(0, 2fr) minmax(280px, 1fr);
  gap: 12px; align-items: start;
}
.tools-page [hidden] { display:none !important; }
.tools-heading { display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:12px; margin-bottom:20px; }
.tools-heading .section-head { margin:0; }
.tools-search { display:flex; align-items:center; gap:10px; flex:0 1 360px; max-width:100%; padding:10px 12px; background:var(--surface); border:1px solid var(--border); border-radius:9px; }
.tools-search:focus-within { border-color:var(--accent); }
.tools-search svg { width:17px; height:17px; color:var(--text-3); flex:none; }
.tools-search input { min-width:0; width:100%; border:0; outline:0; background:none; color:var(--text); font:inherit; font-size:13px; }
.tools-board:has(> [hidden]) { grid-template-columns:minmax(0,1fr); }
.tools-main, .tools-aside { display: grid; gap: 12px; align-items: start; min-width: 0; }
.tools-quick-grid {
  display: grid; grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 12px; align-items: start;
}
.tool-card {
  padding: 13px 14px; border-radius: var(--radius-sm);
  border: var(--border-w) solid var(--border);
  background: var(--surface); box-shadow: var(--shadow-card);
  backdrop-filter: var(--glass); -webkit-backdrop-filter: var(--glass);
  display: flex; flex-direction: column; gap: 10px;
  transition: box-shadow .2s ease, border-color .2s ease;
}
.tool-card:hover { box-shadow: var(--shadow-pop); }
.tool-card-wide { min-height: 0; }
.tool-head { display: flex; align-items: center; gap: 10px; }
.tool-head svg { width: 17px; height: 17px; color: var(--accent); }
.tool-head h3 { font-family: var(--font-display); font-weight: var(--display-weight); font-size: 15px; }
.tool-row { display: flex; gap: 8px; align-items: center; }
.tool-split { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.tool-output {
  font-family: var(--font-mono); font-size: 13.5px;
  padding: 10px 13px; border-radius: var(--radius-sm);
  background: var(--bg-sunken); border: var(--border-w) solid var(--border);
  word-break: break-all; min-height: 42px;
  display: flex; align-items: center; justify-content: space-between; gap: 8px;
  font-variant-numeric: tabular-nums;
}
.tool-label { font-size: 12px; color: var(--text-3); font-weight: 600; }
.tool-error {
  color: oklch(55% 0.18 28); background: oklch(96% 0.04 28);
  border: var(--border-w) solid oklch(86% 0.08 28);
  border-radius: var(--radius-sm); padding: 9px 11px; font-size: 12.5px; line-height: 1.55;
}
.range { accent-color: var(--accent); flex: 1; }
.stat-row { display: flex; gap: 9px; }
.stat-box {
  flex: 1; text-align: center; padding: 9px 6px;
  border-radius: var(--radius-sm); background: var(--bg-sunken);
  border: var(--border-w) solid var(--border);
}
.stat-num { font-family: var(--font-mono); font-size: 18px; font-weight: 700; color: var(--accent); }
.stat-lab { font-size: 11px; color: var(--text-3); margin-top: 1px; }
.color-swatch { width: 42px; height: 42px; border-radius: var(--radius-sm); border: var(--border-w) solid var(--border); flex-shrink: 0; }
.dice-result {
  font-family: var(--font-display); font-weight: var(--display-weight);
  font-size: 19px; text-align: center; padding: 16px 12px; min-height: 60px;
  border-radius: var(--radius-sm); background: var(--accent-soft); color: var(--accent);
  display: grid; place-items: center;
}
.pdf-drop {
  min-height: 104px; border-radius: var(--radius-sm);
  border: 1.5px dashed color-mix(in oklch, var(--accent) 42%, var(--border));
  background: color-mix(in oklch, var(--accent-soft) 44%, var(--surface));
  display: flex; align-items: center; gap: 12px; padding: 13px;
  cursor: pointer; transition: border-color .18s, background .18s;
}
.pdf-drop:hover { border-color: var(--accent); background: color-mix(in oklch, var(--accent-soft) 62%, var(--surface)); }
.pdf-drop svg { width: 24px; height: 24px; color: var(--accent); flex-shrink: 0; }
.pdf-drop strong { display: block; font-size: 13.5px; color: var(--text); margin-bottom: 4px; word-break: break-all; }
.pdf-drop span { display: block; font-size: 12px; color: var(--text-3); }
.pdf-file-meta {
  display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px;
}
.pdf-file-meta > div {
  min-width: 0; border-radius: var(--radius-sm); border: var(--border-w) solid var(--border);
  background: var(--bg-sunken); padding: 9px 10px;
}
.pdf-file-meta span {
  display: block; color: var(--text-3); font-size: 11px; margin-bottom: 4px;
}
.pdf-file-meta strong {
  display: block; color: var(--text); font-size: 12.5px; font-weight: 650;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.pdf-preset-row { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.preset-btn {
  position: relative; text-align: left; border-radius: var(--radius-sm);
  border: var(--border-w) solid var(--border); background: var(--bg-sunken);
  color: var(--text); padding: 10px; cursor: pointer; transition: border-color .18s, background .18s;
}
.preset-btn:hover, .preset-btn.active { border-color: var(--accent); background: var(--accent-soft); }
.preset-btn:disabled { cursor: not-allowed; opacity: .65; }
.preset-btn strong { display: block; font-size: 13px; margin-bottom: 3px; }
.preset-btn span { display: block; font-size: 11.5px; color: var(--text-3); }
.preset-btn em {
  position: absolute; right: 8px; top: 8px; font-style: normal; font-size: 10px;
  color: var(--accent); opacity: .75;
}
.progress-track {
  height: 8px; border-radius: 99px; background: var(--bg-sunken);
  border: var(--border-w) solid var(--border); overflow: hidden;
}
.progress-track span {
  display: block; height: 100%; border-radius: inherit; background: var(--accent);
  transition: width .25s ease;
}
.progress-track.ratio span { background: oklch(62% 0.16 165); }
.ratio-wrap {
  border-radius: var(--radius-sm); border: var(--border-w) solid var(--border);
  background: var(--bg-sunken); padding: 10px; display: grid; gap: 8px;
}
.pdf-result-panel {
  display: grid; gap: 9px; padding: 11px;
  border-radius: var(--radius-sm); border: var(--border-w) solid color-mix(in oklch, var(--accent) 46%, var(--border));
  background: color-mix(in oklch, var(--accent-soft) 36%, var(--surface));
}
.pdf-result-panel > div:first-child span {
  display: block; color: var(--text-3); font-size: 11px; margin-bottom: 4px;
}
.pdf-result-panel > div:first-child strong {
  display: block; color: var(--text); font-size: 13px; word-break: break-all;
}
.ratio-head, .file-compare { display: flex; justify-content: space-between; gap: 10px; align-items: center; }
.ratio-head span, .file-compare span { color: var(--text-3); font-size: 12px; }
.ratio-head strong { font-family: var(--font-mono); color: var(--accent); }

/* ---------- 弹窗 ---------- */
.modal-overlay {
  position: fixed; inset: 0; z-index: 50;
  background: oklch(0% 0 0 / .4);
  display: grid; place-items: center; padding: 24px;
  animation: fadeIn .2s ease; overflow-y: auto;
  backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
}
.modal {
  width: min(440px, 100%); max-height: calc(100vh - 80px); overflow-y: auto;
  background: var(--raised); border-radius: var(--radius-lg);
  border: var(--border-w) solid var(--border);
  box-shadow: var(--shadow-pop);
  padding: 24px;
  animation: popIn .25s cubic-bezier(.2,1.2,.4,1);
}
.modal.wide { width: min(600px, 100%); }
.modal h2 { font-family: var(--font-display); font-weight: var(--display-weight); font-size: 17px; margin-bottom: 16px; }
.form-field { margin-bottom: 14px; }
.form-field label { display: block; font-size: 12.5px; font-weight: 650; color: var(--text-2); margin-bottom: 6px; }
.form-hint { font-size: 11.5px; color: var(--text-3); margin-top: 4px; }
.modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px; }
.img-preview { width: 100%; max-height: 220px; object-fit: cover; border-radius: var(--radius-sm); border: var(--border-w) solid var(--border); display: block; }
.detail-cover { width: 100%; max-height: 320px; object-fit: cover; border-radius: var(--radius-sm); display: block; margin-bottom: 16px; }
.detail-text {
  font-size: 13.5px; line-height: 1.8; color: var(--text-2);
  background: var(--bg-sunken); border: var(--border-w) solid var(--border); border-radius: var(--radius-sm);
  padding: 14px 16px; white-space: pre-wrap; word-break: break-word;
}
@keyframes fadeIn { from { opacity: 0; } }
@keyframes popIn { from { opacity: 0; transform: scale(.93) translateY(8px); } }

/* ---------- 皮肤切换面板（侧边栏底部弹出） ---------- */
.skin-panel {
  position: fixed; z-index: 60; width: 212px;
  background: var(--raised); border: var(--border-w) solid var(--border);
  border-radius: var(--radius); box-shadow: var(--shadow-pop);
  backdrop-filter: blur(22px) saturate(1.6); -webkit-backdrop-filter: blur(22px) saturate(1.6);
  padding: 10px;
  opacity: 0; visibility: hidden; transform: translateX(-6px) scale(.96);
  transform-origin: left bottom;
  transition: opacity .16s ease, transform .16s ease, visibility .16s;
}
.skin-panel.open { opacity: 1; visibility: visible; transform: none; }
/* 边框外伸出的小尖角，指向左侧设置按钮（旋转方块 + 左下描边） */
.skin-panel::before {
  content: ""; position: absolute; left: -6px; bottom: 11px;
  width: 12px; height: 12px; background: var(--raised);
  border-left: var(--border-w) solid var(--border);
  border-bottom: var(--border-w) solid var(--border);
  transform: rotate(45deg); border-bottom-left-radius: 3px;
}
.skin-option {
  display: flex; align-items: center; gap: 10px; width: 100%;
  padding: 8px 10px; border-radius: var(--radius-sm);
  border: var(--border-w) solid transparent; background: transparent;
  color: var(--text-2); font-size: 13px; font-weight: 600; text-align: left;
  transition: all .15s ease;
}
.skin-option:hover { background: var(--bg-sunken); color: var(--text); }
.skin-option.active { color: var(--accent); border-color: var(--border); background: var(--accent-soft); }
.skin-dot { width: 15px; height: 15px; border-radius: 50%; flex-shrink: 0; border: 2px solid var(--border); }

/* ---------- 灵感库：筛选栏 / 星标 / 徽章 ---------- */
.feed-toolbar { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; margin-bottom: 10px; }
.feed-toolbar .filter-bar { flex: 1; margin-bottom: 0; }
.feed-toolbar .feed-refresh { flex-shrink: 0; }
.filter-bar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
.filter-bar .select-mini {
  padding: 4px 26px 4px 10px; border-radius: 8px; font-size: 12px; font-weight: 600;
  border: var(--border-w) solid var(--border); background: var(--surface); color: var(--text-2);
  outline: none; appearance: auto; cursor: pointer;
}
.filter-chip {
  padding: 3px 11px; border-radius: 99px; font-size: 11.5px; font-weight: 600;
  border: var(--border-w) solid var(--border); background: transparent; color: var(--text-3);
  transition: all .15s;
}
.filter-chip:hover { color: var(--text-1); border-color: var(--text-3); }
.filter-chip.active { background: var(--text-2); color: var(--bg); border-color: var(--text-2); }
.star-btn {
  border: none; background: none; padding: 2px; display: grid; place-items: center;
  color: var(--text-3); transition: color .15s, transform .15s; cursor: pointer;
}
.star-btn:hover { transform: scale(1.2); color: oklch(75% 0.15 85); }
.star-btn.on { color: oklch(75% 0.15 85); }
.star-btn svg { width: 15px; height: 15px; }
.model-chip {
  border-radius: 5px; padding: 0 6px; font-size: 10.5px; font-weight: 700;
  background: var(--bg-sunken); border: var(--border-w) solid var(--border); color: var(--text-2);
  white-space: nowrap;
}
.sns-chip {
  border-radius: 5px; padding: 0 6px; font-size: 10.5px; font-weight: 700;
  background: var(--accent-soft); color: var(--accent); white-space: nowrap;
}
.archived-mask { opacity: .55; }

/* ---------- 抽屉（详情 / 编辑） ---------- */
.drawer-overlay {
  position: fixed; inset: 0; z-index: 50; background: oklch(0% 0 0 / .4);
  animation: fadeIn .2s ease;
  backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px);
}
.drawer {
  position: fixed; top: 0; right: 0; bottom: 0; z-index: 51;
  width: min(540px, 100vw);
  background: var(--raised); border-left: var(--border-w) solid var(--border);
  box-shadow: var(--shadow-pop);
  display: flex; flex-direction: column;
  animation: drawerIn .25s cubic-bezier(.2, 1, .4, 1);
}
@keyframes drawerIn { from { transform: translateX(60px); opacity: 0; } }
.drawer-head {
  display: flex; align-items: center; gap: 10px;
  padding: 14px 18px; border-bottom: var(--border-w) solid var(--border); flex-shrink: 0;
}
.drawer-head h2 { font-family: var(--font-display); font-weight: var(--display-weight); font-size: 15.5px; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.drawer-body { flex: 1; overflow-y: auto; padding: 16px 18px 28px; }
.drawer-foot { display: flex; gap: 8px; padding: 12px 18px; border-top: var(--border-w) solid var(--border); flex-shrink: 0; }
.drawer-foot .spacer { margin-left: auto; }
.field-block { margin-bottom: 14px; }
.field-block label { display: block; font-size: 11.5px; font-weight: 700; color: var(--text-3); margin-bottom: 4px; letter-spacing: .04em; }
.asset-summary-card {
  display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px;
  padding: 10px; margin-bottom: 14px; border-radius: var(--radius-sm);
  border: var(--border-w) solid var(--border); background: var(--bg-sunken);
}
.asset-summary-card > div {
  min-width: 0; padding: 8px 9px; border-radius: 7px;
  background: var(--surface); border: var(--border-w) solid var(--border);
}
.asset-summary-card span { display: block; font-size: 10.5px; color: var(--text-3); margin-bottom: 3px; }
.asset-summary-card strong { display: block; font-size: 14px; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.asset-summary-card .asset-summary-vars {
  grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 5px;
  background: transparent; border: none; padding: 0;
}
.field-text {
  font-size: 13px; line-height: 1.7; color: var(--text);
  background: var(--bg-sunken); border: var(--border-w) solid var(--border); border-radius: var(--radius-sm);
  padding: 9px 12px; white-space: pre-wrap; word-break: break-word;
}
.field-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0 14px; }
.sns-embed { width: 100%; aspect-ratio: 16 / 9; border: var(--border-w) solid var(--border); border-radius: var(--radius-sm); display: block; background: #000; }
.sns-link-card {
  display: flex; align-items: center; gap: 9px;
  padding: 9px 12px; border-radius: var(--radius-sm);
  border: var(--border-w) solid var(--border); background: var(--bg-sunken);
  color: var(--text-2); font-size: 12.5px; text-decoration: none; word-break: break-all;
  transition: border-color .15s, color .15s;
}
.sns-link-card:hover { border-color: var(--accent); color: var(--accent); }
.sns-link-card svg { width: 14px; height: 14px; flex-shrink: 0; }
.tag-input-row { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; }

/* ---------- Toast / 空状态 / 回到顶部 ---------- */
.toast {
  position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%); z-index: 60;
  padding: 10px 20px; border-radius: 99px;
  background: var(--text); color: var(--bg);
  font-size: 13px; font-weight: 600;
  box-shadow: var(--shadow-pop);
  display: flex; align-items: center; gap: 8px;
  animation: toastIn .3s cubic-bezier(.2,1.2,.4,1);
}
.toast svg { width: 14px; height: 14px; }
@keyframes toastIn { from { opacity: 0; transform: translateX(-50%) translateY(16px); } }

.empty-state {
  text-align: center; padding: 48px 20px;
  border: var(--border-w) dashed var(--border); border-radius: var(--radius);
}
.empty-state .empty-icon {
  width: 56px; height: 56px; margin: 0 auto 12px; border-radius: var(--radius);
  display: grid; place-items: center;
  background: var(--accent-soft); color: var(--accent);
}
.empty-state .empty-icon svg { width: 24px; height: 24px; }
.empty-state p { color: var(--text-3); font-size: 13.5px; }

.back-top {
  position: fixed; bottom: 24px; right: 24px; z-index: 45;
  width: 42px; height: 42px; border-radius: 99px;
  display: grid; place-items: center;
  background: var(--surface); border: var(--border-w) solid var(--border); color: var(--text-2);
