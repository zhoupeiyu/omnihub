services:
  media-worker:
    build: .
    image: omnihub-media-worker:local
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MEDIA_WORKER_PORT:-8110}:8110"
    environment:
      MEDIA_WORKER_TOKEN: ${MEDIA_WORKER_TOKEN:?set a random bearer token}
      MEDIA_WORKER_ROOT: /var/lib/media-worker
      MEDIA_WORKER_MAX_UPLOAD_BYTES: "104857600"
      MEDIA_WORKER_MAX_OUTPUT_BYTES: "262144000"
      MEDIA_WORKER_CACHE_BYTES: "2147483648"
      MEDIA_WORKER_JOB_TIMEOUT_SECONDS: "600"
      MEDIA_WORKER_THREADS: "2"
      NUMBA_CACHE_DIR: /tmp/numba-cache
      XDG_CACHE_HOME: /tmp/cache
      OMP_NUM_THREADS: "2"
      OPENBLAS_NUM_THREADS: "2"
      NUMBA_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
      VECLIB_MAXIMUM_THREADS: "2"
    volumes:
      - media-worker-data:/var/lib/media-worker
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 900m
    memswap_limit: 900m
    cpus: 2.0
    pids_limit: 192
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import os,urllib.request; r=urllib.request.Request('http://127.0.0.1:8110/health',headers={'Authorization':'Bearer '+os.environ['MEDIA_WORKER_TOKEN']}); assert urllib.request.urlopen(r,timeout=5).status==200\""]
      interval: 20s
      timeout: 6s
      retries: 3
      start_period: 25s
volumes:
  media-worker-data:
